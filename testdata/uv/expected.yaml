      -f, --find-links=*: Locations to search for candidate distributions, in addition to those found in the registry indexes
      -i, --index-url=: '(Deprecated: use `--default-index` instead) The URL of the Python package index (by default: <https://pypi.org/simple>)'
  - name: auth
    description: Manage authentication
    commands:
      - name: dir
        description: Show the path to the uv credentials directory
      - name: helper
        description: Act as a credential helper for external tools
        hidden: true
        flags:
          --protocol=!: The credential helper protocol to use
        commands:
          - name: get
            description: Retrieve credentials for a URI
      - name: login
        description: Login to a service
        flags:
          --keyring-provider=: The keyring provider to use for storage of credentials
          --password=: The password to use for the service
          -t, --token=: The token to use for the service
          -u, --username=: The username to use for the service
      - name: logout
        description: Logout of a service
        flags:
          --keyring-provider=: The keyring provider to use for storage of credentials
          -u, --username=: The username to logout
      - name: token
        description: Show the authentication token for a service
        flags:
          --keyring-provider=: The keyring provider to use for reading credentials
          -u, --username=: The username to lookup
