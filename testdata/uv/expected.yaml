  - name: cache
    description: Manage uv's cache
    commands:
      - name: clean
        aliases:
          - clear
        description: Clear the cache, removing all entries or those linked to specific packages
        flags:
          --force: Force removal of the cache, ignoring in-use checks
      - name: dir
        description: Show the cache directory
      - name: prune
        description: Prune dangling cache entries and cached environments
        flags:
          --ci: Optimize the cache for persistence in a continuous integration environment, like GitHub Actions
          --force: Force removal of the cache, ignoring in-use checks
      - name: size
        description: Show the cache size
        flags:
          --human-readable&: Display the cache size in human-readable format (e.g., `1.2GiB` instead of raw bytes)
          --output-format=:
            description: Select the output format
            default: auto
          -H, --human: Display the cache size in human-readable format (e.g., `1.2GiB` instead of raw bytes)
