    description: The implementation of the build backend
    hidden: true
    commands:
      - name: build-editable
        description: PEP 660 hook `build_editable`
        flags:
          --metadata-directory=: ""
      - name: build-sdist
        description: PEP 517 hook `build_sdist`
      - name: build-wheel
        description: PEP 517 hook `build_wheel`
