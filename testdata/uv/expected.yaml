# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: uv
description: An extremely fast Python package manager.
flags:
  -V, --version: Display the uv version
persistentflags:
  --allow-insecure-host=*: Allow insecure connections to a host
  --allow-python-downloads&: 'Allow automatically downloading Python when required. [env: "UV_PYTHON_DOWNLOADS=auto"]'
  --cache-dir=: Path to the cache directory
  --color=: Control the use of color in output
  --config-file=: The path to a `uv.toml` file to use for configuration
  --directory=: Change to the given directory prior to running the command
  --isolated&: 'Avoid discovering a `pyproject.toml` or `uv.toml` file [env: UV_ISOLATED=]'
  --managed-python: 'Require use of uv-managed Python versions [env: UV_MANAGED_PYTHON=]'
  --native-tls&: '(Deprecated: use `--system-certs` instead.) Whether to load TLS certificates from the platform''s native certificate store [env: UV_NATIVE_TLS=]'
  --no-cache-dir&: Avoid reading from or writing to the cache, instead using a temporary directory for the duration of the operation
  --no-color&: Disable colors
  --no-config: Avoid discovering configuration files (`pyproject.toml`, `uv.toml`)
  --no-installer-metadata&: 'Skip writing `uv` installer metadata files (e.g., `INSTALLER`, `REQUESTED`, and `direct_url.json`) to site-packages `.dist-info` directories [env: UV_NO_INSTALLER_METADATA=]'
  --no-managed-python: 'Disable use of uv-managed Python versions [env: UV_NO_MANAGED_PYTHON=]'
  --no-native-tls&: ""
  --no-offline&: ""
  --no-preview&: ""
  --no-progress: 'Hide all progress outputs [env: UV_NO_PROGRESS=]'
  --no-python-downloads: 'Disable automatic downloads of Python. [env: "UV_PYTHON_DOWNLOADS=never"]'
  --no-system-certs&: ""
  --offline: 'Disable network access [env: UV_OFFLINE=]'
  --preview&: 'Whether to enable all experimental preview features [env: UV_PREVIEW=]'
  --preview-feature=*&: Enable experimental preview features
  --preview-features=*&: Enable experimental preview features
  --project=: Discover a project in the given directory
  --python-fetch=&: Deprecated version of [`Self::python_downloads`]
  --python-preference=&: ""
  --show-settings&: Show the resolved settings for the current command
  --system-certs: 'Whether to load TLS certificates from the platform''s native certificate store [env: UV_SYSTEM_CERTS=]'
  --trusted-host=*&: Allow insecure connections to a host
  -h, --help: Display the concise help for this command
  -n, --no-cache: Avoid reading from or writing to the cache, instead using a temporary directory for the duration of the operation
  -q, --quiet*: Use quiet output
  -v, --verbose*: Use verbose output
commands:
  - name: add
    description: Add dependencies to the project
    flags:
      --active: Prefer the active virtual environment over the project's virtual environment
      --binary&: ""
      --bounds=: The kind of version specifier to use when adding dependencies
      --branch=: Branch to use when adding a dependency from Git
      --build&: ""
      --build-isolation&: ""
      --compile&: Compile Python files to bytecode after installation
      --compile-bytecode: Compile Python files to bytecode after installation
      --config-settings-package=*&: Settings to pass to the PEP 517 build backend for a specific package, specified as `PACKAGE:KEY=VALUE` pairs
      --config-settings=*&: Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs
      --constraint=*&: Constrain versions using the given requirements files
      --default-index=: 'The default package index (by default: <https://pypi.org/simple>)'
      --dev: 'Add the requirements to the development dependency group [env: UV_DEV=]'
      --editable: Add the requirements as editable
      --exclude-newer-package=*: Limit candidate packages for specific packages to those that were uploaded prior to the given date
      --exclude-newer=: Limit candidate packages to those that were uploaded prior to the given date
      --extra-index-url=*: '(Deprecated: use `--index` instead) Extra URLs of package indexes to use, in addition to `--index-url`'
      --extra=*: Extras to enable for the dependency
      --force-reinstall&: Reinstall all packages, regardless of whether they're already installed. Implies `--refresh`
      --fork-strategy=: The strategy to use when selecting multiple versions of a given package across Python versions and platforms
      --frozen: 'Add dependencies without re-locking the project [env: UV_FROZEN=]'
      --group=: Add the requirements to the specified dependency group
      --index-strategy=: The strategy to use when resolving against multiple index URLs
      --index=*: The indexes to use when resolving dependencies, in addition to the default index
      --keyring-provider=: Attempt to use `keyring` for authentication for index URLs
      --lfs: Whether to use Git LFS when adding a dependency from Git
      --link-mode=: The method to use when installing packages from the global cache
      --locked: 'Assert that the `uv.lock` will remain unchanged [env: UV_LOCKED=]'
      --no-active&: Prefer project's virtual environment over an active environment
      --no-binary: Don't install pre-built wheels
      --no-binary-package=*: 'Don''t install pre-built wheels for a specific package [env: `UV_NO_BINARY_PACKAGE`=]'
      --no-build: Don't build source distributions
      --no-build-isolation: Disable isolation when building source distributions
      --no-build-isolation-package=*: Disable isolation when building source distributions for a specific package
      --no-build-package=*: 'Don''t build source distributions for a specific package [env: `UV_NO_BUILD_PACKAGE`=]'
      --no-compile&: ""
      --no-compile-bytecode&: ""
      --no-editable&: 'Don''t add the requirements as editable [env: UV_NO_EDITABLE=]'
      --no-editable-package=*&: Don't add the specified requirements as editable
      --no-frozen&: Disable frozen mode, overriding `UV_FROZEN`
      --no-index: Ignore the registry index (e.g., PyPI), instead relying on direct URL dependencies and those provided via `--find-links`
      --no-install-local: 'Do not install local path dependencies [env: UV_NO_INSTALL_LOCAL=]'
      --no-install-package=*: Do not install the given package(s)
      --no-install-project: 'Do not install the current project [env: UV_NO_INSTALL_PROJECT=]'
      --no-install-workspace: 'Do not install any workspace members, including the current project [env: UV_NO_INSTALL_WORKSPACE=]'
      --no-locked&: Disable locked mode, overriding `UV_LOCKED`
      --no-refresh&: ""
      --no-reinstall&: ""
      --no-sources: Ignore the `tool.uv.sources` table when resolving dependencies. Used to lock against the standards-compliant, publishable package metadata, as opposed to using any workspace, Git, URL, or local path sources
      --no-sources-package=*: 'Don''t use sources from the `tool.uv.sources` table for the specified packages [env: `UV_NO_SOURCES_PACKAGE`=]'
      --no-sync: 'Avoid syncing the virtual environment [env: UV_NO_SYNC=]'
      --no-upgrade&: ""
      --no-workspace: Don't add the dependency as a workspace member
      --only-install-local&: Only install local path dependencies
      --only-install-package=*&: Only install the given package(s)
      --only-install-project&: Only install the current project
      --only-install-workspace&: Only install workspace members, including the current project
      --optional=: Add the requirements to the package's optional dependencies for the specified extra
      --package=: Add the dependency to a specific package in the workspace
      --pre&: ""
      --prerelease-package=*: The strategy to use when considering pre-release versions for a specific package
      --prerelease=: The strategy to use when considering pre-release versions
      --raw: Add a dependency as provided
      --raw-sources&: Add a dependency as provided
      --refresh: Refresh all cached data
      --refresh-package=*: Refresh cached data for a specific package
      --reinstall: Reinstall all packages, regardless of whether they're already installed. Implies `--refresh`
      --reinstall-package=*: Reinstall a specific package, regardless of whether it's already installed. Implies `--refresh-package`
      --requirement=*&: Add the packages listed in the given files
      --resolution=: The strategy to use when selecting between the different compatible versions for a given package requirement
      --rev=: Commit to use when adding a dependency from Git
      --script=: Add the dependency to the specified Python script, rather than to a project
      --tag=: Tag to use when adding a dependency from Git
      --upgrade-group=*: Allow upgrades for all packages in a dependency group, ignoring pinned versions in any existing output file
      --workspace: Add the dependency as a workspace member
      -C, --config-setting=*: Settings to pass to the PEP 517 build backend, specified as `KEY=VALUE` pairs
      -P, --upgrade-package=*: Allow upgrades for a specific package, ignoring pinned versions in any existing output file. Implies `--refresh-package`
      -U, --upgrade: Allow package upgrades, ignoring pinned versions in any existing output file. Implies `--refresh`
      -c, --constraints=*: Constrain versions using the given requirements files
      -f, --find-links=*: Locations to search for candidate distributions, in addition to those found in the registry indexes
      -i, --index-url=: '(Deprecated: use `--default-index` instead) The URL of the Python package index (by default: <https://pypi.org/simple>)'
      -m, --marker=: Apply this marker to all added packages
      -p, --python=: The Python interpreter to use for resolving and syncing.
      -r, --requirements=*: Add the packages listed in the given files
