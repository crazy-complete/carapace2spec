  - name: sparse-checkout
    description: Initialize and modify the sparse-checkout
    group: main
    commands:
      - name: add
        description: Add all files under SOME/DIR/ECTORY/ (at any depth) to the sparse checkout
      - name: check-rules
        description: Check whether sparsity rules match one or more paths
        flags:
          --no-cone: use non-cone mode
          -z, --null: terminate input and output paths with NUL byte
      - name: clean
        description: Remove files outside the sparse-checkout definition
        flags:
          --dry-run: list directories that would be removed without deleting them
          --verbose: list every file within the directories considered for removal
          -f, --force: allow deletion of files outside the sparse-checkout definition
      - name: disable
        description: Repopulate the working directory with all files, disabling sparse checkouts
      - name: init
        description: Initialize the sparse-checkout file
        flags:
          --no-cone: use non-cone mode
          --no-sparse-index: do not use sparse index
          --sparse-index: use sparse index
      - name: list
        description: Describe the directories or patterns in the sparse-checkout file
      - name: reapply
        description: Reapply the existing sparse directory specifications
      - name: set
        description: Enable the necessary sparse-checkout config settings
  - name: stash
    description: Stash the changes in a dirty working directory away
    group: main
    commands:
      - name: apply
        description: Apply the stashed changes to the working tree
        flags:
          --index: attempt to recreate the index
          --label-base=: label for the base in diff3 conflict markers
          --label-ours=: label for the upstream side in conflict markers
          --label-theirs=: label for the stashed side in conflict markers
          -q, --quiet: be quiet, only report errors
      - name: branch
        description: create and check out a new branch with the stashes changes
      - name: clear
        description: remove all the stash entries
      - name: create
        description: Create a stash entry without reflog entry
      - name: drop
        description: remove a single stash entry
        flags:
          -q, --quiet: suppress feedback messages
      - name: export
        description: Export stash entries to a ref
        flags:
          --print: print the object ID instead of writing it to a ref
          --to-ref=: save the data to the given ref
      - name: import
        description: Import stash entries from a commit
      - name: list
        description: list the stash entries that you currently have
      - name: pop
        aliases:
          - apply
        description: remove a single stashed state
        flags:
          --index: try to reinstate index changes as well
          -q, --quiet: suppress feedback messages
      - name: push
        description: save your local modifications to a new stash
        flags:
          --auto-advance: auto advance to the next file when selecting hunks interactively
          --inter-hunk-context=: show inter-hunk context
          --no-auto-advance: do not auto advance to the next file when selecting hunks interactively
          --no-keep-index: also apply to index
          --pathspec-file-nul: pathspec elements are separated by NUL character
          --pathspec-from-file=: read pathspec from file
          -S, --staged: only stash staged
          -U, --unified=: generate diffs with <n> lines context
          -a, --all: also stash ignored and untracked
          -k, --keep-index: keep changed added to index
          -m, --message=: set description
          -p, --patch: interactively select hunks between HEAD and working tree
          -q, --quiet: suppress feedback messages
          -u, --include-untracked: also stash untracked
      - name: save
        description: Save local modifications to a new stash (deprecated, use push)
        flags:
          -S, --staged: only stash staged
          -a, --all: also stash ignored and untracked
          -k, --keep-index: keep changed added to index
          -m, --message=: set description
          -p, --patch: interactively select hunks between HEAD and working tree
          -q, --quiet: suppress feedback messages
          -u, --include-untracked: also stash untracked
      - name: show
        description: show the changes recorded in the stash entry
        flags:
          --abbrev=: show only a partial prefix
          --anchored=*: generate a diff using the "anchored diff" algorithm
          --binary: output a binary diff
          --cached: view the changes you staged in the index/cache
          --check: warn if changes introduce conflict markers or whitespace errors
          --color-moved-ws?: configure how whitespace is ignored when performing move detection
          --color-moved?: moved lines of code are colored differently
          --color-words=: equivalent to --word-diff=color plus (if a regex was specified)
          --color?: show colored diff
          --compact-summary: output a condensed summary of extended header information
          --cumulative: synonym for --dirstat=cumulative
          --default-prefix: use the default source and destination prefixes
          --diff-algorithm=: choose a diff algorithm
          --diff-filter=: filter files
          --dirstat-by-file=: synonym for --dirstat=files,param1,param2...
          --dst-prefix=: show the given destination prefix instead of "b/"
          --exit-code: make the program exit with codes similar to diff(1)
          --ext-diff: allow an external diff helper to be executed
          --find-copies-harder: inspect unmodified files as candidates for the source of copy
          --find-object=: look for differences that change the number of occurrences of the specified object
          --follow: continue listing the history of a file beyond renames
          --full-index: show the full pre- and post-image blob object names
          --histogram: generate a diff using the "histogram diff" algorithm
          --ignore-blank-lines: ignore changes whose lines are all blank
          --ignore-cr-at-eol: ignore carriage-return at the end of line when doing a comparison
          --ignore-space-at-eol: ignore changes in whitespace at EOL
          --ignore-submodules=: ignore changes to submodules in the diff generation
          --indent-heuristic: enable the heuristic that shifts diff hunk boundaries to make patches easier to read
          --inter-hunk-context=: show the context between diff hunks
          --ita-invisible-in-index: this option makes the entry appear as a new file
          --ita-visible-in-index: treat 'git add -N' entries as real in the index
          --line-prefix=: prepend an additional prefix to every line of output
          --max-depth=: maximum tree depth to recurse
          --minimal: spend extra time to make sure the smallest possible diff is produced
          --name-only: show only names of changed files
          --name-status: show only names and status of changed files
          --no-abbrev: show the full 40-byte hexadecimal commit object name
          --no-color: turn off colored diff
          --no-color-moved: turn off move detection
          --no-color-moved-ws: do not ignore whitespace when performing move detection
          --no-compact-summary: do not output a condensed summary of extended header information
          --no-exit-code: do not make the program exit with codes similar to diff(1)
          --no-ext-diff: disallow external diff drivers
          --no-find-copies-harder: do not inspect unmodified files as candidates for the source of copy
          --no-follow: do not continue listing the history of a file beyond renames
          --no-full-index: do not show the full pre- and post-image blob object names
          --no-indent-heuristic: disable the indent heuristic
          --no-index: compare paths on the file system
          --no-prefix: do not show any source or destination prefix
          --no-quiet: do not disable all output of the program
          --no-relative: do not exclude changes outside the directory
          --no-rename-empty: whether to use empty blobs as rename source
          --no-renames: turn off rename detection
          --no-text: do not treat all files as text
          --no-textconv: disallow external text conversion filters to be run when comparing binary files
          --numstat: similar to --stat, but shows number of added and deleted lines in decimal notation
          --only-untracked: only untracked
          --output-indicator-context=: specify the character used to indicate context lines in the generated patch
          --output-indicator-new=: specify the character used to indicate new lines in the generated patch
          --output-indicator-old=: specify the character used to indicate old lines in the generated patch
          --output=: output to a specific file instead of stdout
          --patch-with-raw: synonym for -p --raw
          --patch-with-stat: synonym for -p --stat
          --patience: generate a diff using the "patience diff" algorithm
          --pickaxe-all: when -S or -G finds a change, show all the changes in that changeset
          --pickaxe-regex: treat the <string> given to -S as an extended POSIX regular expression to match
          --quiet: disable all output of the program
          --raw: generate the diff in raw format
          --relative=: exclude changes outside the directory
          --rename-empty: whether to use empty blobs as rename source
          --rotate-to=: move the files before the named <file> to the end
          --shortstat: output only the last line of the --stat format
          --skip-to=: discard the files before the named <file> from the output
          --src-prefix=: show the given source prefix instead of "a/"
          --staged: synonym for --cached (view the changes you staged)
          --stat-count=: generate diffstat with limited lines
          --stat-graph-width=: generate diffstat with a given graph width
          --stat-name-width=: generate diffstat with a given filename width
          --stat-width=: generate diffstat with a given width
          --stat=: generate a diffstat
          --submodule=: specify how differences in submodules are shown
          --summary: output a condensed summary of extended header information
          --textconv=: allow external text conversion filters to be run when comparing binary files
          --word-diff-regex=: use <regex> to decide what a word is
          --word-diff?: show a word diff, using the <mode> to delimit changed words
          --ws-error-highlight=: highlight whitespace errors in the context, old or new lines of the diff
          "-0": omit diff output for unmerged entries
          -1, --base: compare with base
          -2, --ours: compare with our branch
          -3, --theirs: compare with their branch
          -B, --break-rewrites=: break complete rewrite changes into pairs of delete and create
          -C, --find-copies=: detect copies as well as renames
          -D, --irreversible-delete: omit the preimage for deletes
          -I, --ignore-matching-lines=*: ignore changes whose all lines match <regex>
          -M, --find-renames=: detect renames
          -O=: control the order in which files appear in the output
          -R: swap two inputs
          -S=: look for differences that change the number of occurrences of the specified string
          -U, --unified=: generate diffs with <n> lines of context instead of the usual three
          -W, --function-context: show whole surrounding functions of changes
          -X, --dirstat=: output the distribution of relative amount of changes for each sub-directory
          -a, --text: treat all files as text
          -b, --ignore-space-change: ignore changes in amount of whitespace
          -c, --cc: combined diff format for merge commits
          -l=: prevent rename/copy detection from running if the number of rename/copy targets exceeds the specified number
          -p, --patch: generate patch
          -s, --no-patch: suppress diff output
          -u, --include-untracked: include untracked
          -w, --ignore-all-space: ignore whitespace when comparing lines
          -z: do not munge pathnames and use NULs as output field terminators
        exclusiveflags:
          - - abbrev
            - no-abbrev
          - - color
            - no-color
          - - color-moved
            - no-color-moved
          - - color-moved-ws
            - no-color-moved-ws
          - - compact-summary
            - no-compact-summary
          - - exit-code
            - no-exit-code
          - - ext-diff
            - no-ext-diff
          - - find-copies-harder
            - no-find-copies-harder
          - - follow
            - no-follow
          - - full-index
            - no-full-index
          - - indent-heuristic
            - no-indent-heuristic
          - - ita-invisible-in-index
            - ita-visible-in-index
          - - no-patch
            - patch
          - - no-quiet
            - quiet
          - - no-relative
            - relative
          - - no-rename-empty
            - rename-empty
          - - no-text
            - text
      - name: store
        description: Store a given stash entry in the reflog
        flags:
          -m, --message=: set description
          -q, --quiet: suppress feedback messages
  - name: status
    description: show the working tree status
    group: main
    flags:
      --ahead-behind: display detailed ahead/behind counts for the branch relative to its upstream branch
      --column?: display untracked files in columns
      --ignore-submodules?: ignore changes to submodules when looking for changes
      --ignored?: show ignored files as well
      --long: give the output in the long-format (default)
      --no-ahead-behind: do not display detailed ahead/behind counts for the branch relative to its upstream branch
      --no-column: do not display untracked files in columns
      --no-renames: turn off rename detection
      --porcelain?: give the output in an easy-to-parse format for scripts
      --renames: turn on rename detection
      --show-stash: show the number of entries currently stashed away
      -M, --find-renames?: turn on rename detection, optionally setting the similarity threshold
      -b, --branch: show the branch and tracking info even in short-format
      -s, --short: give the output in the short-format
      -u, --untracked-files=: show untracked files
      -v, --verbose: also show the textual changes
      -z, --null: terminate entries with NUL instead of LF
  - name: stripspace
    description: Remove unnecessary whitespace
    group: low-level helper
    flags:
      -c, --comment-lines: prepend comment character and space to each line
      -s, --strip-comments: skip and remove all lines starting with comment character
  - name: submodule
    description: Only print error messages
    group: main
    persistentflags:
      --quiet: Only print error messages
    commands:
      - name: absorbgitdirs
        description: Move submodules git dir to superproject
      - name: add
        description: Add the given repository as a submodule
        flags:
          --depth: create a shallow clone of that depth
          --dissociate: use --reference only when cloning
          --name=: set submodule name
          --progress: report progress status
          --ref-format=: ref storage format for the cloned submodule
          --reference=: reference repository
          -b, --branch=: branch of repository to add as submodule
          -f, --force: alllow adding an otherwise ignored submodule path
      - name: deinit
        description: Unregister the given submodules
        flags:
          --all: remove the whole submodule section from the config as well
          --force: remove working tree even if it contains local modifications
      - name: foreach
        description: Evaluates an arbitrary shell command in each checked out submodule
        flags:
          --recursive: traverse nested submodules recursively
      - name: init
        description: Initialize the submodules recorded in the index
      - name: set-branch
        description: Sets the default remote tracking branch
        flags:
          --default: removes the branch configuration key
          -b, --branch=: branch to track
      - name: set-url
        description: Sets the URL of the specified submodule
      - name: status
        description: Show the status of the submodule
        flags:
          --cached: print the SHA-1 recorded in the superproject for each submodule
          --recursive: recurse into nested submodules
      - name: summary
        description: Show commit summary between the given commit and working tree
        flags:
          --cached: use the index to determine the commit instead of HEAD
          --files: compare the commit in the index with that in the submodule HEAD
          --summary-limit=: limit the summary size (number of commits shown in total)
      - name: sync
        description: Synchronizes submodules remote URL to .gitmodules
        flags:
          --recursive: traverse nested submodules recursively
      - name: update
        description: Update the registered submodule
        flags:
          --checkout: checkout commit of superproject as detached HEAD
          --depth=: create a shallow clone
          --dissociate: use --reference only while cloning
          --filter=*: object filtering
          --no-recommend-shallow: ignore configured shallow recommendation
          --progress: force cloning progress
          --recommend-shallow: initial clone will use recommended configuration
          --recursive: traverse submodules recursively
          --ref-format=: specify the reference storage format to use
          --reference=: reference repository
          --remote: use submodules's remote tracking branch to update
          --require-init: disallow cloning into non-empty directory, implies --init
          --single-branch: clone only one branch, HEAD or --branch
          -N, --no-fetch: don't fetch new objects from the remote
          -f, --force: throw away local changes
          -i, --init: initialize all submodules
          -j, --jobs=: clone new submodules in parallel
          -m, --merge: merge commit of superproject into submodule
          -r, --rebase: rebase current branch onto commit of superproject
  - name: subtree
    description: Merge subtrees together and split repository into subtrees
    persistentflags:
      --no-gpg-sign: do not GPG-sign commits
      -P, --prefix=: Specify the path in the repository to the subtree you want to manipulate
      -S, --gpg-sign?: GPG-sign commits
      -d, --debug: Produce even more unnecessary output messages on stderr
      -q, --quiet: Suppress unnecessary output messages on stderr
    commands:
      - name: add
        description: Create the <prefix> subtree
        flags:
          --squash: produce only a single commit that contains all the differences
          -m, --message=: specify <message> as the commit message for the merge commit
      - name: merge <local-commit> [<repository>]
        description: Merge recent changes up to <local-commit> into the <prefix> subtree
        flags:
          --squash: produce only a single commit that contains all the differences
          -m, --message=: specify <message> as the commit message for the merge commit
      - name: pull <repository> <remote-ref>
        description: Exactly like merge, but parallels git pull
        flags:
          --squash: produce only a single commit that contains all the differences
          -m, --message=: specify <message> as the commit message for the merge commit
      - name: push <repository> [+][<local-commit>:]<remote-ref>
        description: Push your subtree to different branches of the remote repository
        flags:
          --annotate=: add <annotation> as a prefix to each commit message
          --ignore-joins: regenerate the entire history
          --onto=: specify the commit ID <onto> to build history from
          --rejoin: merge the newly created synthetic history back into your main project
          -b, --branch=: create a new branch called <branch> that contains the new history
          -m, --message=: specify <message> as the commit message for the merge commit
      - name: split [<local-commit>] [<repository>]
        description: Extract a new, synthetic project history
        flags:
          --annotate=: add <annotation> as a prefix to each commit message
          --ignore-joins: regenerate the entire history
          --onto=: specify the commit ID <onto> to build history from
          --rejoin: merge the newly created synthetic history back into your main project
          -b, --branch=: create a new branch called <branch> that contains the new history
          -m, --message=: specify <message> as the commit message for the merge commit
  - name: svn
    description: Bidirectional operation between a Subversion repository and Git
    group: interaction
  - name: switch
    description: Switch branches
    group: main
    flags:
      --conflict=: conflict style (merge or diff3)
      --discard-changes: throw away local modifications
      --guess: second guess 'git switch <no-such-branch>'
      --ignore-other-worktrees: do not check if another worktree is holding the given ref
      --no-guess: do not second guess 'git switch <no-such-branch>'
      --no-progress: do not force progress reporting
      --no-recurse-submodules: disable recursive updating of submodules
      --no-track: do not set upstream info for new branch
      --orphan=: new unparented branch
      --overwrite-ignore: update ignored files (default)
      --progress: force progress reporting
      --recurse-submodules?: control recursive updating of submodules
      -C, --force-create=: create/reset and switch to a branch
      -c, --create=: create and switch to a new branch
      -d, --detach: detach HEAD at named commit
      -f, --force: force checkout (throw away local modifications)
      -m, --merge: perform a 3-way merge with the new branch
      -q, --quiet: suppress progress reporting
      -t, --track: set upstream info for new branch
  - name: symbolic-ref
    description: Read, modify and delete symbolic refs
    group: low-level manipulator
    flags:
      --no-recurse: stop after dereferencing single level of symbolic ref
      --recurse: follow symbolicReferences
      --short: try to shorten the symbolicRef
      -d, --delete: delete the symbolicRef <name>
      -m=: update the reflog for <name> with <reason>
      -q, --quiet: do not issue an error message if the <name> is not a symbolicRef
  - name: tag
    description: Create, list, delete or verify a tag object signed with GPG
    group: main
    flags:
      --cleanup=: 'how to strip spaces and #comments from message'
      --color?: respect format colors
      --column=: show tag list in columns
      --contains=: print only tags that contain the commit
      --create-reflog: create a reflog
      --format=: format to use for the output
      --merged=: print only tags that are merged
      --no-column: do not show tag list in columns
      --no-contains=: print only tags that don't contain the commit
      --no-create-reflog: do not create a reflog
      --no-merged=: print only tags that are not merged
      --no-sign: do not sign the annotated tag
      --omit-empty: do not output empty tags
      --points-at=: print only tags of the object
      --sort=*: field name to sort on
      --trailer=*: add trailer to the tag message
      -F, --file=: read message from file
      -a, --annotate: annotated tag, needs a message
      -d, --delete: delete tags
      -e, --edit: force edit of tag message
      -f, --force: replace the tag if exists
      -i, --ignore-case: sorting and filtering are case insensitive
      -l, --list: list tag names
      -m, --message=: tag message
      -n: print <n> lines of each tag message
      -s, --sign: annotated and GPG-signed tag
      -u, --local-user=: use another key to sign the tag
      -v, --verify: verify tags
  - name: unpack-file
    description: Creates a temporary file with a blob's contents
    group: low-level interrogator
  - name: unpack-objects
    description: Unpack objects from a packed archive
    group: low-level manipulator
    flags:
      --max-input-size=: die, if the pack is larger than <size>
      --strict: don’t write objects with broken content or links
      -n: dry run
      -q: suppress percentage progress
      -r: try to recover objects  when unpacking a corrupt packfile
  - name: update-index
    description: Register file contents in the working tree to the index
    group: low-level manipulator
    flags:
      --add: if a specified file isn’t in the index already then it’s added
      --assume-unchanged: set the "assume unchanged" bit for paths
      --cacheinfo=: directly insert the specified info into the index
      --chmod=: set the execute permissions on the updated files
      --clear-resolve-undo: forget saved unresolved conflicts
      --force-remove: remove the file from the index even when the working directory still has such a file
      --force-untracked-cache: same as --untracked-cache
      --force-write-index: opposite of --no-force-write-index
      --fsmonitor: enable files system monitor feature
      --fsmonitor-valid: set the "fsmonitor valid" bit for paths
      --ignore-missing: ignores missing files during a --refresh
      --ignore-skip-worktree-entries: do not remove skip-worktree (AKA "index-only") entries
      --ignore-submodules: do not try to update submodules
      --index-info: read index information from stdin
      --index-version=: write the resulting index out in the named on-disk format version
      --info-only: just insert object IDs into the index for following files
      --no-assume-unchanged: unset the "assume unchanged" bit for paths
      --no-fsmonitor: disable files system monitor feature
      --no-fsmonitor-valid: unset the "fsmonitor valid" bit for paths
      --no-ignore-skip-worktree-entries: remove skip-worktree (AKA "index-only") entries
      --no-skip-worktree: unset the "skip-worktree" bit for paths
      --no-split-index: disable split index mode
      --no-untracked-cache: disable untracked cache feature
      --really-refresh: like --refresh, but checks stat information unconditionally
      --refresh: looks at the current index and checks to see if merges or updates are needed
      --remove: if a specified file is in the index but is missing then it’s removed
      --replace: existing entries that conflict with the entry being added are automatically removed
      --show-index-version: report the index format version used by the on-disk index file
      --skip-worktree: set the "skip-worktree" bit for paths
      --split-index: enable split index mode
      --stdin: read a list of paths from the standard input
      --test-untracked-cache: only perform tests on the working directory to make sure untracked cache can be used
      --unmerged: continue if --refresh finds unmerged changes in the index
      --unresolve: restores the unmerged or needs updating state of a file during a merge
      --untracked-cache: enable untracked cache feature
      --verbose: report what is being added and removed from the index
      -g, --again: runs git update-index itself on the paths whose index entries differ from HEAD
      -q: quiet
      -z: paths are separated with NUL character instead of LF
  - name: update-ref
