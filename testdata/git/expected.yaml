      --fork-point: use 'merge-base --fork-point' to refine upstream
      --ignore-date: passed to 'git am'
      --ignore-whitespace: passed to 'git am'
      --keep-base: use the merge-base of upstream and branch as the current base
      --keep-empty: keep commits that become empty
      --no-autosquash: do not move commits that begin with squash!/fixup! under -i
      --no-autostash: do not automatically stash/stash pop before and after
      --no-ff: cherry-pick all commits, even if unchanged
      --no-fork-point: do not use 'merge-base --fork-point' to refine upstream
      --no-gpg-sign: do not GPG-sign commits
