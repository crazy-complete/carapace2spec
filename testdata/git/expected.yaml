        description: Migrate ref store between different formats
        flags:
          --dry-run: perform the migration, but do not modify the repository
          --no-reflog: do not migrate reflogs
          --ref-format=: the ref format to migrate the ref store to
      - name: optimize
        description: Optimize ref storage
      - name: rename <old-ref> <new-ref>
        description: Rename a reference
        flags:
          --message=: reason of the update
      - name: update <ref> <new-value> [<old-value>]
        description: Update a reference
        flags:
          --create-reflog: create a reflog
          --message=: reason of the update
          --no-deref: update <refname> not the one it points to
      - name: verify
        description: Verify ref database consistency
        flags:
          --strict: enable strict checking
          --verbose: be verbose
  - name: remote
