  - name: fast-export
    description: Git data exporter
    group: manipulator
    flags:
      --anonymize: anonymize the contents of the repository while still retaining the shape of the history and stored tree
      --anonymize-map=*: convert token <from> to <to> in the anonymized output
      --data: opposite of --no-data
      --export-marks=: dumps the internal marks table to <file> when complete
      --fake-missing-tagger: fake a tagger to be able to fast-import the output
      --full-tree: this option will cause fast-export to issue a "deleteall" directive for each commit
      --import-marks-if-exists=: before processing any input, load the marks specified in <file> if it exists
      --import-marks=: before processing any input, load the marks specified in <file>
      --mark-tags: in addition to labelling blobs and commits with mark ids, also label tags
      --no-data: skip output of blob objects and instead refer to blobs via their original SHA-1 hash
      --progress=: insert progress statements every <n> objects
      --reencode=: specify how to handle encoding header in commit objects
      --reference-excluded-parents: refer to commits in the excluded range of history by their sha1sum
      --refspec: apply the specified refspec to each ref exported
      --show-original-ids: add an extra directive to the output for commits and blobs, original-oid <SHA1SUM>
      --signed-commits=: specify how to handle signed commits
      --signed-tags=: specify how to handle signed tags
      --tag-of-filtered-object=: specify how to handle tags whose tagged object is filtered out
      --use-done-feature: start the stream with a feature done stanza, and terminate it with a done command
      -C: perform copy detection
      -M: perform move detection
  - name: fast-import
    description: Backend for fast Git data importers
    group: manipulator
    flags:
      --active-branches=: maximum number of branches to maintain active at once
      --allow-unsafe-features: enable unsafe options
      --big-file-threshold=: maximum size of a blob that fast-import will attempt to create a delta for
      --cat-blob-fd=: write responses to get-mark, cat-blob, and ls queries to the file descriptor <fd> instead of stdout
      --date-format=: specify the type of dates the frontend will supply
      --depth=: maximum delta depth, for blob and tree deltification
      --done: terminate with error if there is no done command at the end of the stream
      --export-marks=: dumps the internal marks table to <file> when complete
      --export-pack-edges=: after creating a packfile, print a line of data to <file>
      --force: force updating modified existing branches
      --import-marks-if-exists=: like --import-marks but instead of erroring out
      --import-marks=: before processing any input, load the marks specified in <file>
      --max-pack-size=: maximum size of each output packfile
      --no-relative-marks: paths are not relative to an internal direcotyr
      --quiet: disable the output shown by --stats
      --relative-marks: paths are relative to an internal directory
      --rewrite-submodules-from=: rewrite the object IDs for the submodule specified by <name>
      --rewrite-submodules-to=: rewrite the object IDs for the submodule specified by <name>
      --signed-commits=: handle signed commits according to mode
      --signed-tags=: handle signed tags according to mode
      --stats: display some basic statistics about the objects fast-import has created
  - name: fetch
    description: Download objects and refs from another repository
    group: main
    flags:
      --all: fetch from all remotes
      --atomic: use an atomic transaction to update local refs
      --auto-gc: run git maintenance run --auto at the end
      --auto-maintenance: run git maintenance run --auto at the end
      --deepen=: deepen history of shallow clone
      --depth=: deepen history of shallow clone
      --dry-run: dry run
      --filter=*: object filtering
      --negotiate-only: do not fetch anything from the server
      --negotiation-include=*: ensure that the commits at the given tips are always sent as "have" lines during fetch negotiation
      --negotiation-restrict=*: report only commits reachable from the given tips as "have" lines during fetch negotiation
      --negotiation-tip=*: report that we have only objects reachable from this object
      --no-all: do not fetch from all remotes
      --no-auto-gc: do not run git maintenance run --auto at the end
      --no-auto-maintenance: do not run git maintenance run --auto at the end
      --no-recurse-submodules: disable recursive fetching of submodules
      --no-show-forced-updates: do not check if a branch is force-updated during fetch
      --no-write-commit-graph: do not write a commit-graph after fetching
      --no-write-fetch-head: do not write the list of remote refs fetched
      --porcelain: produce machine-readable output
      --prefetch: place all refs into the refs/prefetch/ namespace
      --progress: force progress reporting
      --recurse-submodules-default=: used internally to temporarily provide a non-negative default value
      --recurse-submodules=: control recursive fetching of submodules
      --refetch: re-fetch without negotiating common commits
      --refmap=*: specify fetch refmap
      --set-upstream: set upstream for git pull/fetch
      --shallow-exclude=*: deepen history of shallow clone, excluding rev
      --shallow-since=: deepen history of shallow repository based on time
      --show-forced-updates: check for forced-updates on all updated branches
      --stdin: read refspecs, one per line, from stdin
      --submodule-prefix=: prepend <path> to paths printed in informative messages
      --unshallow: convert to a complete repository
      --update-shallow: accept refs that update .git/shallow
      --upload-pack=: path to upload pack on remote end
      --write-commit-graph: write the commit-graph after fetching
      --write-fetch-head: write the list of remote refs fetched
      -4, --ipv4: use IPv4 addresses only
      -6, --ipv6: use IPv6 addresses only
      -P, --prune-tags: prune local tags no longer on remote and clobber changed tags
      -a, --append: append to .git/FETCH_HEAD instead of overwriting
      -f, --force: force overwrite of local reference
      -j, --jobs=: number of submodules fetched in parallel
      -k, --keep: keep downloaded pack
      -m, --multiple: fetch from multiple remotes
      -n, --no-tags: disable automatic tag following
      -o, --server-option=: option to transmit
      -p, --prune: prune remote-tracking branches no longer on remote
      -q, --quiet: be more quiet
      -t, --tags: fetch all tags and associated objects
      -u, --update-head-ok: allow updating of HEAD ref
      -v, --verbose: be more verbose
  - name: fetch-pack
    description: Receive missing objects from another repository
    group: low-level synching
    flags:
      --all: fetch all remote refs
      --check-self-contained-and-connected: output "connectivity-ok" if the received pack is self-contained and connected
      --deepen-relative: argument --depth specifies the number of commits from the current shallow boundary instead of from the tip of each remote branch history
      --depth=: limit fetching to ancestor-chains not longer than n
      --diag-url: show the type of the remote
      --exec=: same as --upload-pack=<git-upload-pack>
      --include-tag: if the remote side supports it, annotated tags objects will be downloaded on the same connection
      --no-progress: do not show the progress
      --refetch: skips negotiating commits with the server in order to fetch all matching objects
      --shallow-exclude=: deepen or shorten the history of a shallow repository to exclude commits reachable from a specified remote branch or tag
      --shallow-since=: deepen or shorten the history of a shallow repository to include all reachable commits after <date>
      --stdin: take the list of refs from stdin, one per line
      --thin: fetch a "thin" pack, which records objects in deltified form based on objects not included in the pack
      --upload-pack=: use this to specify the path to git-upload-pack on the remote side, if is not found on your $PATH
      -k, --keep: do not invoke git unpack-objects on received data, but create a single packfile out of it instead
      -q, --quiet: pass -q flag to git unpack-objects; this makes the cloning process less verbose
      -v: run verbosely
  - name: filter-branch
    description: Rewrite branches
    group: manipulator
    flags:
      --commit-filter=: this is the filter for performing the commit
      --env-filter=: this filter may be used if you only need to modify the environment in which the commit will be performed
      --index-filter=: this is the filter for rewriting the index
      --msg-filter=: this is the filter for rewriting the commit messages
      --original=: use this option to set the namespace where the original commits will be stored
      --parent-filter=: this is the filter for rewriting the commit’s parent list
      --prune-empty: some filters will generate empty commits that leave the tree untouched
      --setup=: this is not a real filter executed for each commit but a one time setup just before the loop
      --state-branch=: this option will cause the mapping from old to new objects to be loaded from named branch
      --subdirectory-filter=: only look at the history which touches the given subdirectory
      --tag-name-filter=: this is the filter for rewriting tag names
      --tree-filter=: this is the filter for rewriting the tree and its contents
      -d=: use this option to set the path to the temporary directory used for rewriting
      -f, --force: force to start with an existing temporary directory or when there are already refs starting with refs/original/
  - name: fmt-merge-msg
    description: Produce a merge commit message
    group: low-level helper
    flags:
      --into-name=: prepare the merge message as if merging to the branch <branch>
      --log=: at most <n> commits from each merge parent will be used (20 if <n> is omitted)
      --no-log: do not list one-line descriptions from the actual commits being merged
      -F, --file=: take the list of merged objects from <file> instead of stdin
      -m, --message=: use <message> instead of the branch names for the first line of the log message
  - name: for-each-ref
    description: Output information on each ref
    group: low-level interrogator
    flags:
      --color=: respect any colors specified in the --format option
      --contains=: only list refs which contain the specified commit
      --count=: limit refs
      --exclude=*: only list refs which do not match any excluded pattern(s)
      --format=: a string that interpolates %(fieldname) from a ref being shown
      --ignore-case: sorting and filtering refs are case insensitive
      --include-root-refs: also list root refs (refs pointing to root commits)
      --merged=: only list refs whose tips are reachable from the specified commit
      --no-contains=: only list refs which don’t contain the specified commit
      --no-merged=: only list refs whose tips are not reachable from the specified commit
      --omit-empty: do not print a newline after formatted refs
      --perl: quote strings for perl
      --points-at=: only list refs which points at the given object
      --python: quote strings for python
      --shell: 'quote strings for shell '
      --sort=*: field name to sort on
      --start-after=: start listing refs after the given marker
      --stdin: read patterns from standard input
      --tcl: quote strings for tcl
    exclusiveflags:
      - - perl
        - python
        - shell
        - tcl
  - name: for-each-repo
    description: Run a Git command on a list of repositories
    group: low-level interrogator
    flags:
      --config=: use the given config variable as a multi-valued list storing absolute path names
      --keep-going: continue with the remaining repositories if the command failed on a repository
  - name: format-patch
    description: Prepare patches for e-mail submission
    group: main
    flags:
      --add-header=*: add email header
      --attach?: attach the patch
      --base=: add prerequisite tree info to the patch series
      --binary: opposite of --no-binary
      --cc=*: 'add Cc: header'
      --commit-list-format=: format for commit list in cover letter
      --cover-from-description=: generate parts of a cover letter based on a branch's description
      --cover-letter: generate a cover letter
      --creation-factor=: 'percentage by which creation is weighted '
      --description-file=: read cover letter description from file
      --filename-max-length=: max length of output filename
      --force-in-body-from: 'force From: header in body even if it matches the author'
      --from?: set From address to <ident> (or committer ident if absent)
      --ignore-if-in-upstream: don't include a patch that matches a commit on an upstream branch
      --in-reply-to=: make first mail a reply to <message-id>
      --inline?: inline the patch
      --interdiff=: show changes against <rev> in cover letter or single patch
      --no-binary: don't output binary diffs
      --numbered-files: use simple number sequence for output file names
      --progress: show progress while generating patches
      --range-diff=: show changes against <refspec> in cover letter or single patch
      --rfc?: use [RFC PATCH] instead of [PATCH]
      --signature-file=: add a signature from a file
      --signature=: add a signature
      --start-number=: start numbering patches at <n> instead of 1
      --stdout: print patches to standard out
      --subject-prefix=: use [<prefix>] instead of [PATCH]
      --suffix=: use <sfx> instead of '.patch'
      --thread?: 'enable message threading, styles: shallow, deep'
      --to=*: 'add To: header'
      --zero-commit: output all-zero hash in From header
      -N, --no-numbered: use [PATCH] even with multiple patches
      -k, --keep-subject: don't strip/add [PATCH]
      -n, --numbered: use [PATCH n/m] even with a single patch
      -o, --output-directory=: store resulting files in <dir>
      -p, --no-stat: show patch format instead of default (patch + stat)
      -q, --quiet: don't print the patch filenames
      -s, --signoff: add a Signed-off-by trailer
      -v, --reroll-count=: mark the series as Nth re-roll
  - name: format-rev
    description: 'EXPERIMENTAL: Pretty format revisions on demand'
    group: low-level interrogator
    flags:
      --format=: pretty format to use
      --notes?*: display notes for pretty format
      --null-input: use NUL for input termination
      --null-output: use NUL for output termination
      --stdin-mode=: how revs are processed
      -z, --null: use NUL for input and output termination
  - name: fsck
    aliases:
      - fsck-objects
    description: Verifies the connectivity and validity of the objects in the database
    group: interrogator
    flags:
      --cache: consider any object recorded in the index also as a head node for an unreachability trace
      --connectivity-only: check only the connectivity of reachable objects
      --dangling: print objects that exist but that are never directly used
      --full: check not just objects in GIT_OBJECT_DIRECTORY
      --lost-found: write dangling objects into .git/lost-found/commit/ or .git/lost-found/other/
      --name-objects: also display a name that describes how objects are reachable
      --no-dangling: do not print objects that exist but that are never directly used
      --no-full: check only objects in GIT_OBJECT_DIRECTORY
      --no-progress: do no report progress status
      --no-reflogs: do not consider commits that are referenced only by an entry in a reflog to be reachable
      --progress: report progress status
      --references: check reference database consistency
      --reflogs: make reflogs head nodes (default)
      --root: report root nodes
      --strict: enable more strict checking
      --tags: report tags
      --unreachable: print out objects that exist but that aren’t reachable from any of the reference nodes
      --verbose: be chatty
  - name: gc
    description: Cleanup unnecessary files and optimize the local repository
    group: main
    flags:
      --aggressive: be more thorough (increased runtime)
      --auto: enable auto-gc mode
      --cruft: pack unreferenced objects separately
      --detach: detach auto-gc from terminal
      --expire-to=: pack prefix to store a pack containing pruned objects
      --force: force running gc even if there may be another gc running
      --keep-largest-pack: repack all other packs except the largest pack
      --max-cruft-size=: maximum size of cruft pack
      --prune?: prune unreferenced objects
      --skip-foreground-tasks&: skip maintenance tasks typically done in the foreground
      -q, --quiet: suppress progress reporting
  - name: get-tar-commit-id
    description: Extract commit ID from an archive created using git-archive
    group: low-level interrogator
  - name: grep
    description: Print lines matching a pattern
    group: main
    flags:
      --all-match: show only matches from files that match all patterns
      --and: combine patterns specified with -e using logical AND
      --break: print empty line between matches from different files
      --cached: search in index instead of in the work tree
      --color?: highlight matches
      --column: show column number of first match
      --exclude-standard: ignore files specified via '.gitignore'
      --ext-grep: allow calling of grep(1) (ignored by this build)
      --full-name: show filenames relative to top directory
      --heading: show filename only once above matches from same file
      --index: opposite of --no-index
      --max-depth=: descend at most <depth> levels
      --name-only: synonym for --files-with-matches
      --no-index: find in contents not managed by git
      --not: combine patterns with logical NOT
      --or: combine patterns with logical OR
      --recurse-submodules: recursively search in each submodule
      --textconv: process binary files with textconv filters
      --threads=: use <n> worker threads
      --untracked: search in both tracked and untracked files
      -A, --after-context=: show <n> context lines after matches
      -B, --before-context=: show <n> context lines before matches
      -C, --context=: show <n> context lines before and after matches
      -E, --extended-regexp: use extended POSIX regular expressions
      -F, --fixed-strings: interpret patterns as fixed strings
      -G, --basic-regexp: use basic POSIX regular expressions (default)
      -H: show filenames
      -I: don't match patterns in binary files
      -L, --files-without-match: show only the names of files without match
      -O, --open-files-in-pager?: show matching files in the pager
      -P, --perl-regexp: use Perl-compatible regular expressions
      -W, --function-context: show whole surrounding functions of matches
      -a, --text: process binary files as text
      -c, --count: show the number of matches instead of matching lines
      -e=: match <pattern>
      -f=*: read patterns from file
      -h: don't show filenames
      -i, --ignore-case: case insensitive matching
      -l, --files-with-matches: show only filenames instead of matching lines
      -m, --max-count=: limit the number of matches per file
      -n, --line-number: show line numbers
      -o, --only-matching: show only matching parts of a line
      -p, --show-function: show a line with the function name before matches
      -q, --quiet: indicate hit with exit status without output
      -r, --recursive: search in subdirectories (default)
      -v, --invert-match: show non-matching lines
      -w, --word-regexp: match patterns only at word boundaries
      -z, --null: print NUL after filenames
  - name: gui
    description: A portable graphical interface to Git
    group: main
    commands:
      - name: blame
        description: Start a blame viewer on the specified file on the given version
        flags:
          --line=: loads annotations as described above and automatically scrolls the view
      - name: browser
        description: Start a tree browser showing all files in the specified commit
      - name: citool
        description: Start git gui and arrange to make exactly one commit before exiting and returning to the shell
        flags:
          --amend: automatically enter the Amend Last Commit mode of the interface
          --nocommit: behave as normal citool, but instead of making a commit simply terminate with a zero exit code
      - name: version
        description: Display the currently running version of git gui
  - name: hash-object
    description: Compute object ID and optionally creates a blob from a file
    group: low-level manipulator
    flags:
      --filters: opposite of --no-filters
      --literally: allow --stdin to hash any garbage into a loose object
      --no-filters: hash the contents as is
      --path=: hash object as if it were located at the given path
      --stdin: read the object from standard input instead of from a file
      --stdin-paths: read file names from the standard input
      -t=: specify the type of object to be created
      -w: actually write the object into the object database
  - name: help
    description: Display help information about Git
    group: interrogator
    flags:
      --aliases: show aliases in --all
      --developer-interfaces: print list of file formats, protocols and other developer interfaces documentation
      --external-commands: show external commands in --all
      --no-aliases: exclude the listing of configured aliases
      --no-external-commands: exclude the listing of external "git-*" commands found in the $PATH
      --user-interfaces: prints a list of the repository, command and file interfaces documentation
      --verbose: print description for all recognized commands
      -a, --all: prints all the available commands on the standard output
      -c, --config: list all available configuration variables
      -g, --guides: prints a list of the Git concept guides on the standard output
      -i, --info: display manual page for the command in the info format
      -m, --man: display manual page for the command in the man format
      -w, --web: display manual page for the command in the web (HTML) format
  - name: history
    description: Rewrite history
    group: main
    commands:
      - name: drop <commit>
        description: Remove <commit>, replaying its descendants onto its parent
        flags:
          --empty=: how to handle descendants that become empty
          --no-dry-run: do not perform a dry-run without updating any refs
          --update-refs=: control which refs should be updated
          -n, --dry-run: perform a dry-run without updating any refs
      - name: fixup
        description: Interactively fix up <commit>
        flags:
          --empty=: how to handle commits that become empty
          --no-dry-run: do not perform a dry-run without updating any refs
          --reedit-message: edit the commit message of the fixup
          --update-refs=: control which refs should be updated
          -n, --dry-run: perform a dry-run without updating any refs
      - name: reword
        description: Rewrite the commit message of the specified commit
        flags:
          --dry-run: perform a dry-run without updating any refs
          --no-dry-run: do not perform a dry-run without updating any refs
          --update-refs=: control which refs should be updated
      - name: split
        description: Interactively split up <commit> into two commits
        flags:
          --dry-run: perform a dry-run without updating any refs
          --no-dry-run: do not perform a dry-run without updating any refs
          --update-refs=: control which refs should be updated
  - name: hook
    description: Run git hooks
    group: low-level helper
    commands:
      - name: list
        description: Print a list of hooks which will be run on <hook-name> event
        flags:
          --allow-unknown-hook-name: allow running a hook with a non-native hook name
          --no-allow-unknown-hook-name: do not allow running a hook with a non-native hook name
          --no-show-scope: do not show the config scope that defined each hook
          --show-scope: show the config scope that defined each hook
          -z: use NUL as line terminator
      - name: run [--ignore-missing] [--to-stdin=<path>] <hook-name> [-- <hook-args>]
        description: Run git hooks
        flags:
          --allow-unknown-hook-name: allow running a hook with a non-native hook name
          --ignore-missing: ignore any missing hook by quietly returning zero
          --to-stdin=: specify a file which will be streamed into the hook’s stdin
          -j, --jobs=: number of hooks to run in parallel
  - name: http-backend
    description: Server side implementation of Git over HTTP
    group: low-level synching
  - name: http-fetch
    description: Download from a remote Git repository via HTTP
    group: low-level synching
    flags:
      --index-pack-args=: command to run on the contents of the downloaded pack
      --packfile=: fetch the packfile directly
      --recover: erify that everything reachable from target is fetched
      --stdin: expect commit-id lines on stdin
      -v: report what is downloaded
      -w=: write the commit-id into the specified filename
    exclusiveflags:
      - - packfile
        - stdin
  - name: http-push
    description: Push objects over HTTP/DAV to another repository
    group: low-level synching
    flags:
      --all: verify all objects in the entire local ref’s history exist
      --dry-run: do everything except actually send the updates
      --force: disable ancestor check
      --verbose: report the list of objects being walked and successfully sent
      -D: remove <ref> from remote repository
      -d: remove <ref> from remote repository
    exclusiveflags:
      - - D
        - d
  - name: imap-send
    description: Send a collection of patches from stdin to an IMAP folder
    group: interaction
    flags:
      --curl: use libcurl to communicate with the IMAP server
      --draft: mark uploaded messages with the IMAP \Draft flag
      --list: list all folders on the IMAP server
      --no-curl: do not use libcurl to communicate with the IMAP server
      --no-draft: do not mark uploaded messages with the IMAP \Draft flag
      -f, --folder=: specify the IMAP folder
      -q, --quiet: be more quiet
      -v, --verbose: be more verbose
  - name: index-pack
    description: Build pack index file for an existing packed archive
    group: low-level manipulator
    flags:
      --check-self-contained-and-connected: die if the pack contains broken links
      --fix-thin: fix a "thin" pack produced by git pack-objects --thin
      --fsck-objects?: die if the pack contains broken objects
      --index-version=: force version for the generated pack index
      --keep: create an empty .keep file before moving the index
      --max-input-size=: die, if the pack is larger than <size>
      --no-rev-index: do not generate a reverse index
      --object-format=: specify the given object format (hash algorithm) for the pack
      --progress-title: set the title of the progress bar
      --promisor?: create a .promisor file for this pack
      --rev-index: generate a reverse index
      --stdin: read from stdin instead and write a copy to <pack-file>
      --strict?: die, if the pack contains broken objects or links
      --threads=: specifies the number of threads to spawn when resolving deltas
      --verify: verify the pack without writing anything
      -o=: write the generated pack index into the specified file
      -v: be verbose about what is going on
  - name: init
    aliases:
      - init-db
    description: Create an empty Git repository or reinitialize an existing one
    group: main
    flags:
      --bare: create a bare repository
      --object-format=: specify the hash algorithm to use
      --ref-format=: specify the reference format for the repository
      --separate-git-dir=: separate git dir from working tree
      --shared?: specify that the git repository is to be shared amongst several users
      --template=: directory from which templates will be used
      -b, --initial-branch=: override the name of the initial branch
      -q, --quiet: be quiet
  - name: instaweb
    description: Instantly browse your working repository in gitweb
    group: interrogator
    flags:
      --restart: restart the web server
      --start: start the web server
      --stop: stop the web server
      -b, --browser=: the browser to launch
      -d, --httpd=: the command to launch
      -l, --local: only bind on 127.0.0.1
      -m, --module-path=: module path
      -p, --port=: the port to bind to
  - name: interpret-trailers
    description: Add or parse structured information in commit messages
    group: low-level helper
    flags:
      --divider: opposite of --no-divider
      --if-exists=: action if trailer already exists
      --if-missing=: action if trailer is missing
      --in-place: edit files in place
      --no-divider: do not treat --- specially
      --only-input: do not apply config rules
      --only-trailers: output only the trailers
      --parse: set parsing options
      --trailer=*: trailer(s) to add
      --trim-empty: trim empty trailers
      --unfold: join whitespace-continued values
      --where=: where to place the new trailer
  - name: last-modified
    description: 'EXPERIMENTAL: Show when files were last modified'
    group: low-level interrogator
    flags:
      --max-depth=: maximum tree depth to recurse
      -r, --recursive: recurse into subtrees
      -t, --show-trees: show tree entries when recursing into subtrees
      -z: lines are separated with NUL character
  - name: log
    description: Show commit logs
    group: main
    flags:
      --abbrev-commit: show a prefix that names the object uniquely
      --abbrev=: show only a partial prefix
      --after=: show commits more recent than a specific date
      --all: pretend as if all the refs in refs/ are listed on the command line
      --all-match: limit output to ones matching all given --grep
      --alternate-refs: pretend as if all alternate ref tips are listed on the command line
      --ancestry-path?: only display commits in that range that are ancestors of <commit>, descendants of <commit>, or <commit> itself
      --anchored=*: generate a diff using the "anchored diff" algorithm
      --author-date-order: show commits in the author timestamp order
      --author=*: limit output to ones with matching author header
      --basic-regexp: consider the limiting patterns to be basic regular expressions
      --before=: show commits older than a specific date
      --binary: output a binary diff
      --bisect: limit output to the one commit object which is roughly halfway between included and excluded commits
      --bisect-all: output all the commit objects between the included and excluded commits
      --bisect-vars: calculate the same as --bisect, except that refs in refs/bisect/ are not used
      --boundary: output excluded boundary commits
      --branches?*: pretend as if all the refs in refs/heads are listed on the command line
      --cached: view the changes you staged in the index/cache
      --check: warn if changes introduce conflict markers or whitespace errors
      --cherry: a synonym for --right-only --cherry-mark --no-merges
      --cherry-mark: like --cherry-pick but mark commits rather than omitting them
      --cherry-pick: omit any commit that introduces the same change as another commit
      --children: print also the children of the commit
      --clear-decorations: clear all previous decorate-refs options
      --color-moved-ws?: configure how whitespace is ignored when performing move detection
      --color-moved?: moved lines of code are colored differently
      --color-words=: equivalent to --word-diff=color plus (if a regex was specified)
      --color?: show colored diff
      --combined-all-paths: list the name of the file from all parents in combined diffs for merge commits
      --commit-header: overrides a previous --no-commit-header
      --committer=*: limit output to ones with matching committer header
      --compact-summary: output a condensed summary of extended header information
      --count: only print a number stating how many commits would have been listed
      --cumulative: synonym for --dirstat=cumulative
      --date-order: show commits in the commit timestamp order
      --date=: date format
      --decorate-refs-exclude=*: do not decorate refs matching pattern
      --decorate-refs=*: decorate refs matching pattern
      --decorate?: print out the ref names of any commits that are shown
      --default: use argument as default revision
      --default-prefix: use the default source and destination prefixes
      --dense: only the selected commits are shown, plus some to have a meaningful history
      --diff-algorithm=: choose a diff algorithm
      --diff-filter=: filter files
      --diff-merges=: specify diff format to be used for merge commits
      --dirstat-by-file=: synonym for --dirstat=files,param1,param2...
      --disk-usage?: suppress normal output and print disk usage
      --do-walk: overrides a previous --no-walk
      --dst-prefix=: show the given destination prefix instead of "b/"
      --early-output: undocumented
      --encoding=: re-code the commit log message in given encoding
      --exclude-first-parent-only: for excluded commits follow only the first parent commit upon merge
      --exclude-hidden?: do not include refs that would be hidden
      --exclude-promisor-objects: prefilter object traversal at promisor boundary
      --exclude=*: do not include matching refs the next option would consider
      --exit-code: make the program exit with codes similar to diff(1)
      --expand-tabs=: perform a tab expansion
      --ext-diff: allow an external diff helper to be executed
      --filter-print-omitted: print a list of the objects omitted by the filter
      --filter-provided-objects: filter the list of explicitly provided objects
      --filter=: omit objects from the list of printed objects
      --find-copies-harder: inspect unmodified files as candidates for the source of copy
