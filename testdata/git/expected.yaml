  - name: scalar
    description: A tool for managing large Git repositories
    group: main
    commands:
      - name: clone
        description: Clone a repository with Scalar optimizations
        flags:
          --full-clone: do not create a partial clone
          --maintenance: enable automatic maintenance
          --single-branch: clone only the history leading to the tip of a single branch
          --src: show source URL
          --tags: clone tags
          -b, --branch=: clone only the history leading to the tip of the specified branch
      - name: delete
        description: Delete an existing Scalar enlistment
      - name: diagnose
        description: Collect diagnostic information for a Scalar enlistment
      - name: list
        description: List Scalar enlistments
      - name: reconfigure
        description: Reconfigure Scalar enlistment
        flags:
          --all: reconfigure all enlistments
          --maintenance=: maintenance mode
      - name: register
        description: Register a repository with Scalar
        flags:
          --maintenance: enable automatic maintenance
      - name: run
        description: Run a Scalar maintenance task
        flags:
          --task=: run a specific task
      - name: unregister
        description: Unregister a repository from Scalar
      - name: version
        description: Show Scalar version
        flags:
          --build-options: also print build options
          -v, --verbose: include Git version
