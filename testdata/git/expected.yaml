      -w, --ignore-all-space: ignore whitespace when comparing lines
      -z: do not munge pathnames and use NULs as output field terminators
    exclusiveflags:
      - - abbrev
        - no-abbrev
      - - color
        - no-color
      - - color-moved
        - no-color-moved
      - - color-moved-ws
        - no-color-moved-ws
      - - compact-summary
        - no-compact-summary
      - - exit-code
        - no-exit-code
      - - ext-diff
        - no-ext-diff
      - - find-copies-harder
        - no-find-copies-harder
      - - follow
        - no-follow
      - - full-index
        - no-full-index
      - - indent-heuristic
        - no-indent-heuristic
      - - ita-invisible-in-index
        - ita-visible-in-index
      - - no-patch
        - patch
      - - no-quiet
        - quiet
      - - no-relative
        - relative
      - - no-rename-empty
        - rename-empty
      - - no-text
        - text
  - name: worktree
    description: Manage multiple working trees
    group: main
    commands:
      - name: add
        description: Create a worktree at <path> and checkout <commit-ish> into it
        flags:
          --checkout: populate the new working tree
          --guess-remote: try to match the new branch name with a remote-tracking branch
          --lock: keep the new working tree locked
          --orphan: create unborn branch
          --reason=: reason for locking
          --relative-paths: use relative paths for worktrees
          --track: set up tracking mode
          -B=: create or reset a branch
          -b=: create a new branch
          -d, --detach: detach HEAD at named commit
          -f, --force: checkout <branch> even if already checked out in other worktree
          -q, --quiet: suppress progress reporting
      - name: list
        description: List details of each worktree
        flags:
          --expire=: add 'prunable' annotation to worktrees older than <time>
          --porcelain: machine-readable output
          -v, --verbose: show extended annotations and reasons, if available
          -z: terminate records with a NUL character
      - name: lock
        description: Lock administrative files from being pruned automatically
        flags:
          --expire=: add 'prunable' annotation to worktrees older than <time>
          --porcelain: machine-readable output
          -v, --verbose: show extended annotations and reasons, if available
          -z: terminate records with a NUL character
      - name: move
        description: Move a worktree to a new location
        flags:
          -f, --force: force move even if worktree is dirty or locked
      - name: prune
        description: Prune worktree information in $GIT_DIR/worktrees
        flags:
          --expire=: expire working trees older than <time>
          -n, --dry-run: do not remove, show only
          -v, --verbose: report pruned working trees
      - name: remove
        description: Remove a worktree
        flags:
          -f, --force: force removal even if worktree is dirty or locked
      - name: repair
        description: Repair worktree administrative files, if possible
      - name: unlock
        description: Unlock a worktree
  - name: write-tree
    description: Create a tree object from the current index
    group: low-level manipulator
    flags:
      --missing-ok: allow missing objects
      --prefix=: write tree object for a subdirectory <prefix>
documentation:
  command: https://git-scm.com/
