      --shortstat: output only the last line of the --stat format
      --show-linear-break=: put a barrier in between branches in graph output
      --show-notes-by-default: show the default notes
      --show-pulls: include also any merge commits that are not TREESAME to the first parent but are TREESAME to a later parent
      --show-signature: check the validity of a signed commit object
      --simplify-by-decoration: commits that are referred by some branch or tag are selected
      --simplify-merges: additional option to --full-history to remove some needless merges from the resulting history
      --since-as-filter=: show all commits more recent than a specific date
      --since=: show commits more recent than a specific date
      --single-worktree: examine the current working tree only
      --skip-to=: discard the files before the named <file> from the output
      --skip=: skip number commits before starting to show the commit output
      --source: print out the ref name given on the command line by which each commit was reached
      --sparse: all commits in the simplified history are shown
      --src-prefix=: show the given source prefix instead of "a/"
      --staged: synonym for --cached (view the changes you staged)
      --stat-count=: generate diffstat with limited lines
      --stat-graph-width=: generate diffstat with a given graph width
      --stat-name-width=: generate diffstat with a given filename width
      --stat-width=: generate diffstat with a given width
      --stat=: generate a diffstat
      --stdin: read arguments from standard input as well
      --submodule=: specify how differences in submodules are shown
      --summary: output a condensed summary of extended header information
      --tags?*: pretend as if all the refs in refs/tags are listed on the command line
      --textconv=: allow external text conversion filters to be run when comparing binary files
      --timestamp: print the raw commit timestamp
      --topo-order: avoid showing commits on multiple lines of history intermixed
      --unpacked: print the object IDs that are not in packs
      --until=: show commits older than a specific date
      --use-bitmap-index: try to speed up the traversal using the pack bitmap index
      --use-mailmap: use mailmap file to map author and committer names and email addresses to canonical real names and email addresses
      --word-diff-regex=: use <regex> to decide what a word is
      --word-diff?: show a word diff, using the <mode> to delimit changed words
      --ws-error-highlight=: highlight whitespace errors in the context, old or new lines of the diff
      "-0": omit diff output for unmerged entries
      -1, --base: compare with base
      -2, --ours: compare with our branch
      -3, --theirs: compare with their branch
      -B, --break-rewrites=: break complete rewrite changes into pairs of delete and create
      -C, --find-copies=: detect copies as well as renames
      -D, --irreversible-delete: omit the preimage for deletes
      -E, --extended-regexp: consider the limiting patterns to be extended regular expressions
      -F, --fixed-strings: consider the limiting patterns to be fixed strings
      -G=*: look for differences whose patch text contains added/removed lines that match <regex>
      -I, --ignore-matching-lines=*: ignore changes whose all lines match <regex>
      -L=*: trace the evolution of the line range given by <start>,<end>, or by the function name regex <funcname>, within the <file>
      -M, --find-renames=: detect renames
      -O=: control the order in which files appear in the output
      -P, --perl-regexp: consider the limiting patterns to be Perl-compatible regular expressions
      -R: swap two inputs
      -S=: look for differences that change the number of occurrences of the specified string
      -U, --unified=: generate diffs with <n> lines of context instead of the usual three
      -W, --function-context: show whole surrounding functions of changes
      -X, --dirstat=: output the distribution of relative amount of changes for each sub-directory
      -a, --text: treat all files as text
      -b, --ignore-space-change: ignore changes in amount of whitespace
      -c, --cc: combined diff format for merge commits
      -g, --walk-reflogs: walk reflog entries from the most recent one to older ones
      -h, --help: show help
      -i, --regexp-ignore-case: match the regular expression case insensitive
      -l=: prevent rename/copy detection from running if the number of rename/copy targets exceeds the specified number
      -n, --max-count=: limit the number of commits to output
      -p, --patch: generate patch
      -s, --no-patch: suppress diff output
      -t: show the tree objects in the diff output
      -w, --ignore-all-space: ignore whitespace when comparing lines
      -z: do not munge pathnames and use NULs as output field terminators
    exclusiveflags:
      - - abbrev
        - no-abbrev
      - - color
        - no-color
      - - color-moved
        - no-color-moved
      - - color-moved-ws
        - no-color-moved-ws
      - - compact-summary
        - no-compact-summary
      - - exit-code
        - no-exit-code
      - - ext-diff
        - no-ext-diff
      - - find-copies-harder
        - no-find-copies-harder
      - - follow
        - no-follow
      - - full-index
        - no-full-index
      - - indent-heuristic
        - no-indent-heuristic
      - - ita-invisible-in-index
        - ita-visible-in-index
      - - no-patch
        - patch
      - - no-quiet
        - quiet
      - - no-relative
        - relative
      - - no-rename-empty
        - rename-empty
      - - no-text
        - text
  - name: ls-files
    description: Show information about files in the index and the working tree
    group: low-level interrogator
    flags:
      --abbrev=: use <n> digits to display object names
      --debug: show debugging data
      --deduplicate: suppress duplicate entries
      --directory: show 'other' directories' names only
      --empty-directory: don't show empty directories
      --eol: show line endings of files
      --error-unmatch: if any <file> is not in the index, treat this as an error
      --exclude-per-directory=: read additional per-directory exclude patterns in <file>
      --exclude-standard: add the standard git exclusions
      --format=: format to use for the output
      --full-name: make the output relative to the project top directory
      --recurse-submodules: recurse through submodules
      --resolve-undo: show resolve-undo information
      --sparse: show sparse directories in the presence of a sparse index
      --with-tree=: pretend that paths removed since <tree-ish> are still present
      -X, --exclude-from=: read exclude patterns from <file>
      -c, --cached: show cached files in the output (default)
      -d, --deleted: show deleted files in the output
      -f: use lowercase letters for 'fsmonitor clean' files
      -i, --ignored: show ignored files in the output
      -k, --killed: show files on the filesystem that need to be removed
      -m, --modified: show modified files in the output
      -o, --others: show other files in the output
      -s, --stage: show staged contents' object name in the output
      -t: identify the file status with tags
      -u, --unmerged: show unmerged files in the output
      -v: use lowercase letters for 'assume unchanged' files
      -x, --exclude=: skip files matching pattern
      -z: separate paths with the NUL character
  - name: ls-remote
    description: List references in a remote repository
    group: low-level interrogator
    flags:
      --exit-code: exit with exit code 2 if no matching refs are found
      --get-url: take url.<base>.insteadOf into account
      --refs: do not show peeled tags
      --sort?*: field name to sort on
      --symref: show underlying ref in addition to the object pointed by it
      --upload-pack=: path of git-upload-pack on the remote host
      -b, --branches: limit to branches
      -h, --heads: limit to heads
      -o, --server-option=: option to transmit
      -q, --quiet: do not print remote URL
      -t, --tags: limit to tags
  - name: ls-tree
    description: List the contents of a tree object
    group: low-level interrogator
    flags:
      --abbrev?: use <n> digits to display object names
      --format=: format to use for the output
      --full-name: use full path names
      --full-tree: list entire tree
      --name-only: list only filenames
      --name-status: list only filenames
      --no-abbrev: do not use abbreviated digits to display object names
      --no-full-name: do not use full path names
      --no-full-tree: do not list entire tree
      --object-only: list only objects
      -d: only show trees
      -l, --long: include object size
      -r: recurse into subtrees
      -t: show trees when recursing
      -z: terminate entries with NUL byte
  - name: mailinfo
    description: Extracts patch and authorship from a single e-mail message
    group: low-level helper
    flags:
      --encoding=: re-code metadata to this encoding
      --inbody-headers&: use headers in message's body
      --quoted-cr=: action when quoted CR is found
      --scissors: use scissors
      -b: keep non patch brackets in subject
      -k: keep subject
      -m, --message-id: copy Message-ID to the end of commit message
      -n: disable charset re-coding of metadata
      -u: re-code metadata to i18n.commitEncoding
  - name: mailsplit
    description: Simple UNIX mbox splitter program
    group: low-level helper
    flags:
      --keep-cr: "do not remove \r from lines ending with \r\n"
      --mboxrd: input is of the "mboxrd" format and "^>+From " line escaping is reversed
      -b: if any file doesn’t begin with a From line, assume it is a single mail message
      -d=: precision for the generated filenames
      -f=: skip the first <nn> numbers
      -o=: directory in which to place the individual messages
  - name: maintenance
    description: Run tasks to optimize Git repository data
    group: main
    commands:
      - name: is-needed
        description: Check if maintenance needs to be run
        flags:
          --auto: check if required thresholds are met without actually running maintenance
          --task=*: check a specific task
      - name: register
        description: Initialize Git config values
        flags:
          --config-file=: use given config file
      - name: run
        description: Start running maintenance on the current repository
        flags:
          --auto: run tasks based on the state of the repository
          --detach: perform maintenance in the background
          --quiet: don't report progress or other information to stderr
          --schedule=: run tasks based on frequency
          --task=*: run a specific task
      - name: start
        description: Start running maintenance on the current repository
        flags:
          --scheduler=: specify scheduler
      - name: stop
        description: Halt the background maintenance schedule
      - name: unregister
        description: Remove the current repository from background maintenance
  - name: merge
    description: Join two or more development histories together
    group: main
    flags:
      --abort: abort the current in-progress merge
      --allow-unrelated-histories: allow merging unrelated histories
      --autostash: automatically stash/stash pop before and after
      --cleanup=: 'how to strip spaces and #comments from message'
      --commit: perform a commit if the merge succeeds (default)
      --compact-summary: show a condensed summary of extended header information
      --continue: continue the current in-progress merge
      --ff: allow fast-forward (default)
      --ff-only: abort if fast-forward is not possible
      --into-name=: use <name> instead of the real target
      --log=: add (at most <n>) entries from shortlog to merge commit message
      --no-autostash: do not create a temporary stash entry
      --no-commit: perform the merge and stop just before creating a merge commit
      --no-edit: accept the auto-generated message
      --no-ff: force merge commit
      --no-gpg-sign: countermand both commit.gpgSign and earlier --gpg-sign
      --no-log: do not list one-line descriptions from the actual commits being merged
      --no-overwrite-ignore: do not overwrite ignored files from the merge result
      --no-progress: do not show progress
      --no-rerere-autoupdate: 'do not update index automatically '
      --no-signoff: countermand an earlier --signoff
      --no-squash: perform the merge and commit the result
      --no-summary: do not show a summary of what was merged
      --no-verify: bypass pre-merge-commit and commit-msg hooks
      --no-verify-signatures: do not verify signatures
      --overwrite-ignore: update ignored files (default)
      --progress: force progress reporting
      --quit: --abort but leave index and working tree alone
      --rerere-autoupdate: update the index with reused conflict resolution if possible
      --signoff: add a Signed-off-by trailer
      --squash: create a single commit instead of doing a merge
      --stat: show a diffstat at the end of the merge
      --summary: (synonym to --stat)
      --verify: run pre-merge-commit and commit-msg hooks
      --verify-signatures: verify that the named commit has a valid GPG signature
      -F, --file=: read message from file
      -S, --gpg-sign?: GPG-sign commits
      -X, --strategy-option=: option for selected merge strategy
      -e, --edit: edit message before committing
      -m, --message=: merge commit message
      -n, --no-stat: do not show a diffstat at the end of the merge
      -q, --quiet: be more quiet
      -s, --strategy=*: merge strategy to use
      -v, --verbose: be more verbose
  - name: merge-base
    description: Find as good common ancestors as possible for a merge
    group: low-level interrogator
    flags:
      --fork-point: find the point at which a branch forked from another branch <ref>
      --independent: print a minimal subset of the supplied commits with the same ancestors
      --is-ancestor: check if the first <commit> is an ancestor of the second <commit>
      --octopus: compute the best common ancestors of all supplied commits
      -a, --all: output all merge bases for the commits
    exclusiveflags:
      - - fork-point
        - independent
        - is-ancestor
        - octopus
  - name: merge-file
    description: Run a three-way file merge
    group: low-level manipulator
    flags:
      --diff-algorithm=: use a different diff algorithm while merging
      --diff3: show conflicts in "diff3" style
      --marker-size=: conflict marker size
      --object-id: specify the contents to merge as blobs in the current repository instead of files
      --ours: resolve conflicts favouring our side of the lines
      --theirs: resolve conflicts favouring their side of the lines
      --union: resolve conflicts favouring both side of the lines
      --zdiff3: show conflicts in "zdiff3" style
      -L=*: use labels in place of the file names in conflict reports
      -p, --stdout: send results to standard output instead of overwriting <current>
      -q, --quiet: do not warn about conflicts
  - name: merge-index
    description: Run a merge for files needing merging
    group: low-level manipulator
    flags:
      -a: run merge against all files in the index that need merging
      -o: instead of stopping at the first failed merge, do all of them in one shot
      -q: do not complain about a failed merge program
  - name: merge-one-file
    description: The standard helper program to use with git-merge-index
    group: low-level helper
  - name: merge-tree
    description: Perform merge without touching index or working tree
    group: interrogator
    flags:
      --allow-unrelated-histories: override common history check and make the merge proceed anyway
      --merge-base=: specify a merge-base for the merge
      --messages: write any informational messages such as "Auto-merging <path>" or CONFLICT notices to the end of stdout
      --name-only: in the Conflicted file info section
      --no-messages: do not write any informational messages such as "Auto-merging <path>" or CONFLICT notices to the end of stdout
      --quiet: disable all output; only exit status matters
      --stdin: perform multiple merges, one per line of input
      --trivial-merge: do a trivial merge only
      --write-tree: do a real merge instead of a trivial merge
      -X, --strategy-option=: pass merge strategy specific option through
      -z: do not quote filenames in the <Conflicted file info> section
  - name: mergetool
    description: Run merge conflict resolution tools to resolve merge conflicts
    group: manipulator
    flags:
      --no-gui: this overrides a previous -g or --gui setting
      --prompt: prompt before each invocation of the merge resolution program to give the user a chance to skip the path
      --tool-help: print a list of merge tools that may be used with --tool
      --tool?: use the merge resolution program specified by <tool>
      -g, --gui: read from the configured merge.guitool variable instead of merge.tool
      -y, --no-prompt: don’t prompt before each invocation of the merge resolution program
  - name: mktag
    description: Creates a tag object
    group: low-level manipulator
    flags:
      --strict: enable more strict checking
  - name: mktree
    description: Build a tree-object from ls-tree formatted text
    group: low-level manipulator
    flags:
      --batch: allow creation of more than one tree
      --missing: allow missing objects
      --no-batch: do not allow creation of more than one tree
      --no-missing: do not allow missing objects
      -z: input is NUL terminated
  - name: multi-pack-index
    description: Write and verify multi-pack-indexes
    group: low-level manipulator
    flags:
      --no-progress: turn progress off
      --object-dir=: use given directory for the location of Git objects
      --progress: turn progress on
    commands:
      - name: compact
        description: Compact a multi-pack-index
        flags:
          --base=: base MIDX for incremental writes
          --bitmap: write multi-pack bitmap
          --incremental: write a new incremental MIDX
          --no-write-chain-file: do not write the multi-pack-index chain file
          --object-dir=: use given directory for the location of Git objects
          --progress: force progress reporting
      - name: expire
        description: Delete the pack-files that are tracked by the MIDX file
      - name: repack
        description: Create a new pack-file containing objects in small pack-files
      - name: verify
        description: Verify the contents of the MIDX file
      - name: write
        description: Write a new MIDX file
        flags:
          --base=: base MIDX for incremental writes
          --bitmap: write a multi-pack bitmap
          --incremental: write a new incremental MIDX
          --no-bitmap: do not write a multi-pack bitmap
          --no-write-chain-file: do not write the multi-pack-index chain file
          --preferred-pack=: specify the tie-breaking pack used when multiple packs contain the same object
          --refs-snapshot=: specify a file which contains a "refs snapshot" taken prior to repacking
          --stdin-packs: provide pack index basenames over stdin
  - name: mv
    description: Move or rename a file, a directory, or a symlink
    group: main
    flags:
      --sparse: allow moving into sparse-checkout cone
      -f, --force: force move/rename even if target exists
      -k: skip move/rename errors
      -n, --dry-run: dry run
      -v, --verbose: be verbose
  - name: name-rev
    description: Find symbolic names for given revs
    group: low-level interrogator
    flags:
      --all: list all commits reachable from all refs
      --always: show uniquely abbreviated commit object as fallback
      --annotate-stdin: transform stdin by substituting all the 40-character SHA-1 hexes
      --exclude=*: do not use any ref whose name matches a given shell pattern
      --name-only: print only the name
      --refs=*: only use refs whose names match a given shell pattern
      --tags: only use tags to name the commits
      --undefined: allow to print undefined names
  - name: notes
    description: Add or inspect object notes
    group: main
    flags:
      --ref=: use notes from <notes-ref>
    commands:
      - name: add
        description: Add notes for a given object
        flags:
          --allow-empty: allow an empty note object to be stored
          --separator=: insert <paragraph-break> between paragraphs
          --stripspace: remove unnecessary whitespace
          -C, --reuse-message=: take the given blob object as the note message
          -F, --file=: take the note message from the given file
          -c, --reedit-message=: like -C, but with -c the editor is invoked
          -e, --edit: edit note message in editor
          -m, --message=: use the given note message
      - name: append
        description: Append to the notes of an existing object
        flags:
          --allow-empty: allow an empty note object to be stored
          --separator=: insert <paragraph-break> between paragraphs
          --stripspace: remove unnecessary whitespace
          -C, --reuse-message=: take the given blob object as the note message
          -F, --file=: take the note message from the given file
          -c, --reedit-message=: like -C, but with -c the editor is invoked
          -e, --edit: edit note message in editor
          -m, --message=: use the given note message
      - name: copy
        description: Copy the notes for the first object onto the second object
        flags:
          --for-rewrite=: load rewriting config for <command> (implies --stdin)
          --stdin: also read the object names to remove notes from the standard input
          -f, --force: overwrite existing notes
      - name: edit
        description: Edit the notes for a given object
        flags:
          --allow-empty: allow an empty note object to be stored
          --separator=: insert <paragraph-break> between paragraphs
          --stripspace: remove unnecessary whitespace
          -C, --reuse-message=: take the given blob object as the note message
          -F, --file=: take the note message from the given file
          -c, --reedit-message=: like -C, but with -c the editor is invoked
          -m, --message=: use the given note message
      - name: get-ref
        description: Print the current notes ref
      - name: list
        description: List the notes object for a given object
      - name: merge
        description: Merge the given notes ref into the current notes ref
        flags:
          --abort: abort/reset an in-progress git notes merge
          --commit: finalize an in-progress git notes merge
          -q, --quiet: when merging notes, operate quietly
          -s, --strategy=: resolve notes conflicts using the given strategy
          -v, --verbose: when merging notes, be more verbose
        exclusiveflags:
          - - abort
            - commit
            - strategy
      - name: prune
        description: Remove all notes for non-existing/unreachable objects
        flags:
          -n, --dry-run: do not remove anything, just report
          -v, --verbose: when merging notes, be more verbose
      - name: remove
        description: Remove the notes for given objects
        flags:
          --ignore-missing: do not consider it an error to request removing non existing notes
          --stdin: also read the object names to remove notes from the standard input
      - name: show
        description: Show the notes for a given object
  - name: p4
    description: Import from and submit to Perforce repositories
    group: interaction
  - name: pack-objects
    description: Create a packed archive of objects
    group: low-level manipulator
    flags:
      --all: pretend as if all refs under refs/ are specified to be included
      --all-progress: progress report is displayed during the object count and compression phases
      --all-progress-implied: this is used to imply --all-progress whenever progress display is activated
      --compression=: specifies compression level for newly-compressed data in the generated pack
      --cruft: packs unreachable objects into a separate "cruft" pack
      --cruft-expiration=: eliminate objects from the cruft pack older than <approxidate>
      --delta-base-offset: express the base object of a delta as offset in the stream
      --delta-islands: restrict delta matches based on "islands"
      --depth=: affect how the objects contained in the pack are stored using delta compression
      --exclude-promisor-objects: omit objects that are known to be in the promisor remote
      --exclude-promisor-objects-best-effort: best-effort omit objects that are known to be in the promisor remote
      --filter=*: omit certain objects from the resulting packfile
      --honor-pack-keep: ignore object already in a local pack that has a .keep file,
      --include-tag: include unasked-for annotated tags if the object they reference was included in the resulting packfile
      --incremental: ignore object already in a pack
      --index-version=: force the version for the generated pack index
      --indexed-objects: include objects referred to by the index
      --keep-pack=*: ignore object already in given pack
      --keep-true-parents: keep true parents even with grafts
      --keep-unreachable: objects unreachable from the refs in named packs are added to the resulting pack
      --local: 'object that is borrowed from an alternate object store '
      --max-pack-size=: split the output packfile into multiple independent packfiles
      --missing=: specify how missing objects are handled
      --name-hash-version=: name hash version for pack index
      --no-filter: turn off any previous --filter= argument
      --no-reuse-delta: do not reuse existing deltas
      --no-reuse-object: do not reuse existing object data at all
      --no-sparse: disable "sparse" algorithm
      --non-empty: only create a packed archive if it would contain at least one object
      --pack-loose-unreachable: pack unreachable loose objects
      --path-walk: sort objects by path for better compression
      --progress: progress status is reported on the standard error stream
      --reflog: pretend as if all objects mentioned by reflogs are specified to be included
      --reuse-delta: reuse existing deltas
      --reuse-object: reuse existing object data
      --revs: read the revision arguments from the standard input
      --shallow: optimize a pack that will be provided to a client with a shallow repository
      --sparse: enable "sparse" algorithm
      --stdin-packs: read the basenames of packfiles from the standard input
      --stdout: write the pack contents out to the standard output
      --thin: create a "thin" pack by omitting the common objects between a sender and a receiver
      --threads=: number of threads to spawn when searching for best delta matches
      --unpack-unreachable: keep unreachable objects in loose form
      --unpacked: limit the objects packed to those that are not already packed
      --uri-protocol=: generate a corresponding pack index for each specified URI protocol
      --use-bitmap-index: use a bitmap index if available to speed up counting objects
      --window-memory=: additional limit on top of --window
      --window=: affect how the objects contained in the pack are stored using delta compression
      --write-bitmap-index: write a bitmap index alongside the packfile
      -q, --quiet: do not show progress meter
  - name: pack-redundant
    description: Find redundant pack files
    group: low-level interrogator
    flags:
      --all: processes all packs
      --alt-odb: don’t require objects from alternate odb to be present
      --verbose: outputs some statistics to stderr
  - name: pack-refs
    description: Pack heads and tags for efficient repository access
    group: manipulator
    flags:
      --all: pack everything
      --auto: auto-pack refs as needed
      --exclude=: references to exclude
      --include=: references to include
      --prune: prune loose refs (default)
  - name: patch-id
    description: Compute unique ID for a patch
    group: low-level helper
    flags:
      --stable: use the stable patch-id algorithm
      --unstable: use the unstable patch-id algorithm
      --verbatim: don't strip whitespace from the patch
  - name: prune
    description: Prune all unreachable objects from the object database
    group: manipulator
    flags:
      --exclude-promisor-objects: limit traversal to objects outside promisor packfiles
      --expire=: expire objects older than <time>
      --progress: show progress
      -n, --dry-run: do not remove, show only
      -v, --verbose: report pruned objects
  - name: prune-packed
    description: Remove extra objects that are already in pack files
    group: low-level manipulator
    flags:
      -n, --dry-run: only show objects that would have been removed
      -q, --quiet: squelch the progress indicator
  - name: pull
    description: Fetch from and integrate with another repository or a local branch
    group: main
    flags:
      --all: fetch from all remotes
      --allow-unrelated-histories: allow merging unrelated histories
      --atomic: use an atomic transaction to update local refs
      --autostash: automatically stash/stash pop before and after
      --cleanup=: 'how to strip spaces and #comments from message'
      --commit: perform a commit if the merge succeeds (default)
      --compact-summary: show a condensed summary of extended header information
      --deepen=: deepen history of shallow clone
      --depth=: deepen history of shallow clone
