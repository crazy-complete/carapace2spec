    commands:
      - name: create <ref> <new-value>
        description: Create a reference
        flags:
          --create-reflog: create a reflog
          --message=: reason of the update
          --no-deref: update <refname> not the one it points to
      - name: delete <ref> [<old-value>]
        description: Delete a reference
        flags:
          --message=: reason of the update
          --no-deref: update <refname> not the one it points to
      - name: exists
        description: Check if a reference exists
      - name: list
        description: List references
        flags:
          --color=: respect any colors specified in the --format option
          --contains=: only list refs which contain the specified commit
