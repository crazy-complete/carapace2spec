# yaml-language-server: $schema=https://carapace.sh/schemas/command.json
name: git
description: the stupid content tracker
flags:
  --attr-source=: read gitattributes from <tree-ish> instead of the worktree
  --bare: use $PWD as repository
  --config-env=*: give configuration variable <name> a value
  --exec-path?: path containing core git-programs
  --git-dir=: path to repository
  --glob-pathspecs: add "glob" magic to all pathspec
  --html-path: display path to HTML documentation and exit
  --icase-pathspecs: add "icase" magic to all pathspec
  --info-path: print the path where the info files are installed and exit
  --list-cmds?: list commands
  --literal-pathspecs: treat pathspecs literally, rather than as glob patterns
  --man-path: print the manpath for the man pages for this version of Git and exit
  --namespace=: set the Git namespace
  --no-advice: disable all advice hints from being printed
  --no-lazy-fetch: do not fetch missing objects from the promisor remote on demand
  --no-optional-locks: do not perform optional operations that require locks
  --no-replace-objects: do not use replacement refs to replace git objects
  --noglob-pathspecs: add "literal" magic to all pathspec
  --work-tree=: path to working tree
  -C=: run as if git was started in given path
  -P, --no-pager: don't pipe git output into a pager
  -c=*: pass configuration parameter to command
  -h, --help: display help message
  -p, --paginate: pipe output into a pager
  -v, --version: display version information
commands:
  - name: add
    aliases:
      - stage
    description: Add file contents to the index
    group: main
    flags:
      --auto-advance: auto advance to the next file when selecting hunks interactively
      --chmod=: override the executable bit of the added files
      --ignore-errors: if some files could not be added because of errors indexing them, do not abort the operation but continue adding the others
      --ignore-missing: this option can only be used together with --dry-run
      --ignore-removal: update the index by adding new files that are unknown to the index and files modified in the working tree, but ignore files that have been removed from the working tree
      --inter-hunk-context=: show context between diff hunks up to the specified number of lines
      --no-all: update the index by adding new files that are unknown to the index and files modified in the working tree, but ignore files that have been removed from the working tree
      --no-auto-advance: do not auto advance to the next file when selecting hunks interactively
      --no-ignore-removal: update the index not only where the working tree has a file matching <pathspec> but also where the index already has an entry
      --no-warn-embedded-repo: by default, git add will warn when adding an embedded repository to the index without using git submodule add to create an entry in .gitmodules
      --pathspec-file-nul: pathspec elements are separated with NUL character and all other characters are taken literally
      --pathspec-from-file=: pathspec is passed in <file> instead of commandline args
      --refresh: don't add the file(s), but only refresh their stat() information in the index
      --renormalize: apply the "clean" process freshly to all tracked files to forcibly add them again to the index
      --resolved: add conflict-resolved tracked files
      --sparse: allow updating index entries outside of the sparse-checkout cone
      -A, --all: update the index not only where the working tree has a file matching <pathspec> but also where the index already has an entry
      -N, --intent-to-add: record only the fact that the path will be added later
      -U, --unified=: generate diffs with <n> lines of context instead of the usual three
      -e, --edit: open the diff vs. the index in an editor and let the user edit it
      -f, --force: allow adding otherwise ignored files
      -i, --interactive: add modified contents in the working tree interactively to the index
      -n, --dry-run: don't actually add the file(s), just show if they exist and/or will be ignored
      -p, --patch: interactively choose hunks of patch between the index and the work tree and add them to the index
      -u, --update: update the index just where it already has an entry matching <pathspec>
      -v, --verbose: be verbose
  - name: am
    description: Apply a series of patches from a mailbox
    group: main
    flags:
      --abort: restore the original branch and abort the patching operation
      --allow-empty: create an empty commit with the contents of the e-mail message as its log message
      --committer-date-is-author-date: use the author date as committer date
      --continue: continue applying patches after resolving a conflict
      --directory=: pass it through git-apply
      --empty=: how to handle empty patches
      --exclude=*: pass it through git-apply
      --ignore-date: use the committer date as author date
      --ignore-space-change: pass it through git-apply
      --ignore-whitespace: pass it through git-apply
      --include=*: pass it through git-apply
      --keep-cr: pass --keep-cr flag to git-mailsplit for mbox format
      --keep-non-patch: pass -b flag to git-mailinfo
      --no-3way: do not fall back on 3way merging
      --no-gpg-sign: do not GPG-sign commits
      --no-keep-cr: do not pass --keep-cr flag to git-mailsplit independent of am.keepcr
      --no-message-id: do not add the Message-ID header to the commit message
      --no-rerere-autoupdate: do not update the index with reused conflict resolution
      --no-scissors: ignore scissors lines
      --no-utf8: pass -n flag to git-mailinfo
      --no-verify: skip the pre-applypatch and applypatch-msg hooks
      --patch-format=: format the patch(es) are in
      --quit: abort the patching operation but keep HEAD where it is
      --quoted-cr=: pass it through git-mailinfo
      --reject: pass it through git-apply
      --rerere-autoupdate: update the index with reused conflict resolution if possible
      --resolvemsg=: override error message when patch failure occurs
      --retry: try to apply the last conflicting patch again
      --show-current-patch?: show the message at which git-am has stopped due to conflicts
      --skip: skip the current patch
      --verify: run the pre-applypatch and applypatch-msg hooks
      --whitespace=: pass it through git-apply
      -3, --3way: allow fall back on 3way merging if needed
      -C=: pass it through git-apply
      -S, --gpg-sign?: GPG-sign commits
      -c, --scissors: strip everything before a scissors line
      -i, --interactive: run interactively
      -k, --keep: pass -k flag to git-mailinfo
      -m, --message-id: pass -m flag to git-mailinfo
      -p=: pass it through git-apply
      -q, --quiet: be quiet
      -r, --resolved: synonyms for --continue
      -s, --signoff: add a Signed-off-by trailer to the commit message
      -u, --utf8: recode into utf8 (default)
  - name: apply
    description: Apply a patch to files and/or to the index
    group: low-level manipulator
    flags:
      --add: opposite of --no-add
      --allow-empty: don't return an error for patches containing no diff
      --allow-overlap: allow overlapping hunks
      --apply: also apply the patch (use with --stat/--summary/--check)
      --build-fake-ancestor=: build a temporary index based on embedded index information
      --cached: apply a patch without touching the working tree
      --check: instead of applying the patch, see if the patch is applicable
      --directory=: prepend <root> to all filenames
      --exclude=*: don't apply changes matching the given path
      --ignore-space-change: ignore changes in whitespace when finding context
      --ignore-whitespace: ignore changes in whitespace when finding context
      --inaccurate-eof: tolerate incorrectly detected missing new-line at the end of file
      --include=*: apply changes matching the given path
      --index: make sure the patch is applicable to the current index
      --no-add: ignore additions made by the patch
      --numstat: show number of added and deleted lines in decimal notation
      --ours: use our version for conflicting hunks
      --recount: do not trust the line counts in the hunk headers
      --reject: leave the rejected hunks in corresponding *.rej files
      --stat: instead of applying the patch, output diffstat for the input
      --summary: instead of applying the patch, output a summary for the input
      --theirs: use their version for conflicting hunks
      --unidiff-zero: don't expect at least one line of context
      --union: use union version for conflicting hunks
      --unsafe-paths: accept a patch that touches outside the working area
      --whitespace=: detect new or modified lines that have whitespace errors
      -3, --3way: attempt three-way merge, fall back on normal patch if that fails
      -C=: ensure at least <n> lines of context match
      -N, --intent-to-add: mark new files with `git add --intent-to-add`
      -R, --reverse: apply the patch in reverse
      -p=: remove <num> leading slashes from traditional diff paths
      -q, --quiet: suppress report messages
      -v, --verbose: be verbose
      -z: paths are separated with NUL character
  - name: archimport
    description: Import a GNU Arch repository into Git
    group: interaction
    flags:
      -D=: follow merge ancestry and attempt to import trees that have been merged from.
      -T: many tags. Will create a tag for every commit, reflecting the commit name in the Arch repository.
      -a: attempt to auto-register archives at http://mirrors.sourcecontrol.net
      -f: use the fast patchset import strategy.
      -h: display usage.
      -o: use this for compatibility with old-style branch names used by earlier versions of git archimport.
      -t=: override the default tempdir.
      -v: verbose output.
  - name: archive
    description: Create an archive of files from a named tree
    group: main
    flags:
      --add-file=*: add untracked file to archive
      --add-virtual-file=*: add untracked file to archive with given content
      --exec=: path to the remote git-upload-archive command
      --format=: archive format
      --mtime=: set modification time for archive entries
      --prefix=: prepend prefix to each pathname in the archive
      --remote=: retrieve the archive from remote repository <repo>
      --worktree-attributes: read .gitattributes in working directory
      "-0": set compression level
      "-1": set compression level
      "-2": set compression level
      "-3": set compression level
      "-4": set compression level
      "-5": set compression level
      "-6": set compression level
      "-7": set compression level
      "-8": set compression level
      "-9": set compression level
      -l, --list: list supported archive formats
      -o, --output=: write the archive to this file
      -v, --verbose: report archived files on stderr
  - name: backfill
    description: Fetch missing objects in a partial clone on demand
    group: main
    flags:
      --include-edges: request objects at the edges of the partial clone
      --min-batch-size=: minimum number of objects to request at a time
      --no-include-edges: do not request objects at the edges of the partial clone
      --no-sparse: do not restrict the missing objects to the current sparse-checkout
      --sparse: restrict the missing objects to the current sparse-checkout
  - name: bisect
    description: Use binary search to find the commit that introduced a bug
    group: main
    commands:
      - name: bad
        aliases:
          - new
        description: mark a known-bad revision
      - name: good
        aliases:
          - old
        description: mark know-good revisions
      - name: help
        description: Show long usage description
      - name: log
        description: show bisect log
      - name: next
        description: find next bisection commit
      - name: replay
        description: replay bisect log
      - name: reset
        description: finish bisection search and go back to commit
      - name: run
        description: run script to automatically bisect
        flags:
          --reset-when-found?: automatically run "git bisect reset" when the first bad commit has been determined
      - name: skip
        description: mark revisions as untestable
      - name: start
        description: reset bisect state and start bisection
        flags:
          --first-parent: follow only the first parent commit upon seeing a merge commit
          --no-checkout: do not checkout the new working tree at each iteration
          --reset-when-found?: automatically run "git bisect reset" when the first bad commit has been determined
          --term-bad=: set term for new/bad
          --term-good=: set term for old/good
          --term-new=: set term for new/bad
          --term-old=: set term for old/good
        exclusiveflags:
          - - no-checkout
            - reset-when-found
      - name: terms
        description: show the terms used for old and new commits
        flags:
          --term-bad: show term for bad/new
          --term-good: show term for good/old
      - name: visualize
        aliases:
          - view
        description: show bisect status in gitk
        flags:
          --p: show patches
          --stat: show diffstat
  - name: blame
    aliases:
      - annotate
    description: Show what revision and author last modified each line of a file
    group: interrogator
    flags:
      --abbrev?: use <n> digits to display object names
      --color-by-age: color lines by age
      --color-lines: color redundant metadata from previous line differently
      --contents=: use <file>'s contents as the final image
      --diff-algorithm=: choose diff algorithm
      --ignore-rev=*: ignore <rev> when blaming
      --ignore-revs-file=: ignore revisions from <file>
      --incremental: show blame entries as we find them, incrementally
      --line-porcelain: show porcelain format with per-line commit information
      --minimal: spend extra cycles to find better match
      --progress: force progress reporting
      --root: do not treat root commits as boundaries
      --score-debug: show output score for blame entries
      --show-stats: show work cost statistics
      -C?*: find line copies within and across files
      -L=*: process only line range <start>,<end> or function :<funcname>
      -M?: find line movements within and across files
      -S=: use revisions from <file> instead of calling git-rev-list
      -b: do not show object names of boundary commits
      -c: 'use the same output mode as git-annotate '
      -e, --show-email: 'show author email instead of name '
      -f, --show-name: 'show original filename '
      -l: 'show long commit SHA1 '
      -n, --show-number: 'show original linenumber '
      -p, --porcelain: show in a format designed for machine consumption
      -s: 'suppress author name and timestamp '
      -t: 'show raw timestamp '
      -w: ignore whitespace differences
  - name: branch
    description: List, create, or delete branches
    group: main
    flags:
      --abbrev=: alter the sha1s minimum display length in the output listing
      --color=: color branches to highlight current, local, and remote-tracking branches
      --column: display branch listing in columns
      --contains=: only list branches which contain the specified commit (HEAD if not specified)
      --create-reflog: create the branch's reflog
      --delete-merged=*: delete merged branches whose upstream matches <pattern> (repeatable)
      --dry-run: with --delete-merged, only print which branches would be deleted
      --edit-description: open an editor and edit the text to explain what the branch is for
      --format=: a string that interpolates %(fieldname) from a branch ref being shown and the object it points at
      --merged=: only list branches whose tips are reachable from the specified commit (HEAD if not specified)
      --no-abbrev: display the full sha1s in the output listing rather than abbreviating them
      --no-color: turn off branch colors, even when the configuration file gives the default to color output
      --no-column: do not display branch listing in columns
      --no-contains=: only list branches which don't contain the specified commit (HEAD if not specified)
      --no-create-reflog: do not create the branch's reflog
      --no-merged=: only list branches whose tips are not reachable from the specified commit (HEAD if not specified)
      --no-track: do not set up upstream configuration, even if branch.autoSetupMerge is true
      --omit-empty: do not print a newline after formatted refs
      --points-at=: only list branches of the given object
      --recurse-submodules: cause the current command to recurse into submodules
      --set-upstream-to=: set up <branchname>'s tracking information so <upstream> is considered <branchname>'s upstream branch
      --show-current: print the name of the current branch
      --sort=*: sort based on the key given
      --unset-upstream: remove the upstream information for <branchname>
      -C: shortcut for --copy --force
      -D: shortcut for --delete --force
      -M: shortcut for --move --force
      -a, --all: list both remote-tracking branches and local branches
      -c, --copy: copy a branch together with its config and reflog
      -d, --delete: delete a branch
      -f, --force: reset <branchname> to <startpoint>, even if <branchname> exists already
      -i, --ignore-case: sorting and filtering branches are case insensitive
      -l, --list: list branches
      -m, --move: move/rename a branch together with its config and reflog
      -q, --quiet: be more quiet when creating or deleting a branch, suppressing non-error messages
      -r, --remotes: list or delete (if used with -d) the remote-tracking branches
      -t, --track?: when creating a new branch, set up branch.<name>.remote and branch.<name>.merge configuration entries to mark the start-point branch as upstream
      -v, --verbose*: verbose output
  - name: bugreport
    description: Collect information for user to file a bug report
    group: interrogator
    flags:
      --diagnose?: create a zip archive of supplemental information about the user’s machine
      --no-diagnose: create a zip archive of supplemental information about the user’s machine
      -o, --output-directory=: place the resulting bug report file in <path> instead of the current directory
      -s, --suffix=: specify an alternate suffix for the bugreport name
  - name: bundle
    description: Move objects and refs by archive
    group: main
    flags:
      -v, --verbose: be verbose
    commands:
      - name: create
        description: create a bundle
        flags:
          --all-progress: show progress meter during object writing phase
          --all-progress-implied: similar to --all-progress when progress meter is shown
          --progress: show progress meter
          --version=: specify bundle format version
          -q, --quiet: do not show progress meter
      - name: list-heads
        description: list the references defined in the bundle
      - name: unbundle
        description: passes the objects in the bundle for storage in the repository
      - name: verify
        description: check that a bundle file is valid
        flags:
          -q, --quiet: do not show bundle details
  - name: cat-file
    description: Provide content or type and size information for repository objects
    group: low-level interrogator
    flags:
      --allow-unknown-type: allow -s and -t to work with broken/corrupt objects
      --batch-all-objects: show all objects with --batch or --batch-check
      --batch-check=: show info about objects fed from the standard input
      --batch-command=: enter a batch mode on stdin that takes queries and returns results
      --batch=: show info and content of objects fed from the standard input
      --buffer: buffer --batch output
      --filter=: omit objects from the list of printed objects (batch mode)
      --filters: for blob objects, run filters on object's content
      --follow-symlinks: follow in-tree symlinks (used with --batch or --batch-check)
      --mailmap: use mailmap file to map author/committer names
      --no-filter: do not omit objects from the list of printed objects
      --no-mailmap: do not use mailmap file
      --no-use-mailmap: do not use mailmap file
      --path=: use a specific path for --textconv/--filters
      --textconv: for blob objects, run textconv on object's content
      --unordered: do not order --batch-all-objects output
      --use-mailmap: use mailmap file to map author/committer names
      -e: exit with zero when there's no error
      -p: pretty-print object's content
      -s: show object size
      -t: show object type
  - name: check-attr
    description: Display gitattributes information
    group: low-level helper
    flags:
      --cached: use .gitattributes only from the index
      --source=: which tree-ish to check attributes at
      --stdin: read file names from stdin
      -a, --all: report all attributes set on file
      -z: terminate input and output records by a NUL character
  - name: check-ignore
    description: Debug gitignore / exclude files
    group: low-level helper
    flags:
      --index: opposite of --no-index
      --no-index: ignore index when checking
      --stdin: read file names from stdin
      -n, --non-matching: show non-matching input paths
      -q, --quiet: suppress progress reporting
      -v, --verbose: be verbose
      -z: terminate input and output records by a NUL character
  - name: check-mailmap
    description: Show canonical names and email addresses of contacts
    group: low-level helper
    flags:
      --mailmap-blob=: read mailmap from a blob
      --mailmap-file=: read mailmap from a file
      --stdin: also read contacts from stdin
  - name: check-ref-format
    description: Ensures that a reference name is well formed
    group: low-level helper
    flags:
      --allow-onelevel: controls whether one-level refnames are accepted
      --branch: check for valid branch name
      --no-allow-onelevel: controls whether one-level refnames are accepted
      --normalize: normalize refname by removing any leading slash characters
      --refspec-pattern: interpret <refname> as a reference name pattern for a refspec
  - name: checkout
    description: Switch branches or restore working tree files
    group: main
    flags:
      --auto-advance: auto advance to the next file when selecting hunks interactively
      --conflict=: conflict style (merge or diff3)
      --guess: second guess 'git checkout <no-such-branch>' (default)
      --ignore-other-worktrees: do not check if another worktree is holding the given ref
      --ignore-skip-worktree-bits: do not limit pathspecs to sparse entries only
      --inter-hunk-context=: show context between diff hunks up to the specified number of lines
      --no-guess: do not second guess 'git checkout <no-such-branch>'
      --no-overlay: remove files not in <tree-ish>
      --no-overwrite-ignore: do not overwrite ignored files when switching branches
      --no-progress: do not show progress
      --no-recurse-submodules: do not update submodules
      --no-track: do not set up "upstream" configuration
      --orphan=: new unparented branch
      --overlay: use overlay mode (default)
      --overwrite-ignore: update ignored files (default)
      --pathspec-file-nul: pathspec elements are separated with NUL character
      --pathspec-from-file=: read pathspec from file
      --progress: force progress reporting
      --recurse-submodules=: control recursive updating of submodules
      -2, --ours: checkout our version for unmerged files
      -3, --theirs: checkout their version for unmerged files
      -B=: create/reset and checkout a branch
      -U, --unified=: generate diffs with <n> lines of context instead of the usual three
      -b=: create and checkout a new branch
      -d, --detach: detach HEAD at named commit
      -f, --force: force checkout (throw away local modifications)
      -l: create reflog for new branch
      -m, --merge: perform a 3-way merge with the new branch
      -p, --patch: select hunks interactively
      -q, --quiet: suppress progress reporting
      -t, --track?: set upstream info for new branch
  - name: checkout-index
    description: Copy files from the index to the working tree
    group: low-level manipulator
    flags:
      --create: opposite of --no-create
      --ignore-skip-worktree-bits: do not skip files with skip-worktree set
      --prefix=: when creating files, prepend <string>
      --stage=: copy out the files from named stage
      --stdin: read list of paths from the standard input
      --temp: write the content to temporary files
      -a, --all: check out all files in the index
      -f, --force: force overwrite of existing files
      -n, --no-create: don't checkout new files
      -q, --quiet: no warning for existing files and files not in index
      -u, --index: update stat information in the index file
      -z: paths are separated with NUL character
  - name: cherry
    description: Find commits yet to be applied to upstream
    group: low-level interrogator
    flags:
      --abbrev?: use <n> digits to display object names
      -v, --verbose: be verbose
  - name: cherry-pick
    description: Apply the changes introduced by some existing commits
    group: main
    flags:
      --abort: cancel the operation and return to the pre-sequence state
      --allow-empty: preserve empty commits
      --allow-empty-message: allow empty commit message
      --cleanup=: set commit message cleanup mode
      --continue: ontinue the operation in progress
      --empty=: how to handle commits that become empty
      --ff: fast forward
      --keep-redundant-commits: preserve redundant commits
      --no-gpg-sign: do not GPG-sign commits
      --no-rerere-autoupdate: disallow rerere mechanism to update the index
      --quit: forget about the current operation in progress
      --rerere-autoupdate: allow rerere mechanism to update the index
      --skip: skip the current commit
      --strategy=: use the given merge strategy
      -S, --gpg-sign?: GPG-sign commits
      -X, --strategy-option=: pass the merge strategy-specific option through to the merge strategy
      -e, --edit: edit the commit message prior to committing
      -m, --mainline=: specify parent number to pick relative change
      -n, --no-commit: apply changes without committing them
      -s, --signoff: add Signed-off-by line at the end of the commit message
      -x: append cherry-pick source to original commit message
  - name: citool
    description: Graphical alternative to git-commit
    group: main
  - name: clean
    description: Remove untracked files from the working tree
    group: main
    flags:
      -X: remove only ignored files
      -d: remove whole directories
      -e, --exclude=: add <pattern> to ignore rules
      -f, --force: force
      -i, --interactive: interactive cleaning
      -n, --dry-run: dry run
      -q, --quiet: do not print names of files removed
      -x: remove ignored files, too
  - name: clone
    description: Clone a repository into a new directory
    group: main
    flags:
      --also-filter-submodules: apply partial clone filter to submodules
      --bare: create a bare repository
      --bundle-uri=: fetch additional objects from this URI
      --checkout: opposite of --no-checkout
      --depth=: create a shallow clone of that depth
      --dissociate: use --reference only while cloning
      --filter=*: object filtering
      --hardlinks: opposite of --no-hardlinks
      --mirror: create a mirror repository (implies bare)
      --naked&: create a bare repository
      --no-hardlinks: don't use local hardlinks, always copy
      --no-local: override --local, as if file:/// URL was given
      --no-reject-shallow: do not reject shallow repository
      --no-remote-submodules: do not use remote-tracking branch for submodules
      --no-shallow-submodules: do not clone submodules as shallow
      --no-single-branch: clone history leading up to each branch
      --no-tags: don't clone any tags, and make later fetches not to follow them
      --progress: force progress reporting
      --recurse-submodules?: initialize submodules in the clone
      --recursive?: alias of --recurse-submodules
      --ref-format=: specify the reference format for the repository
      --reference-if-able=*: reference repository
      --reference=*: reference repository
      --reject-shallow: do not clone shallow repository
      --remote-submodules: any cloned submodules will use their remote-tracking branch
      --revision=: clone a specific revision
      --separate-git-dir=: separate git dir from working tree
      --server-option=*: option to transmit
      --shallow-exclude=*: deepen history of shallow clone, excluding rev
      --shallow-since=: create a shallow clone since a specific time
      --shallow-submodules: any cloned submodules will be shallow
      --single-branch: clone only one branch, HEAD or --branch
      --sparse: initialize sparse-checkout file to include only files at root
      --tags: clone tags
      --template=: directory from which templates will be used
      -4, --ipv4: use IPv4 addresses only
      -6, --ipv6: use IPv6 addresses only
      -b, --branch=: checkout <branch> instead of the remote's HEAD
      -c, --config=*: set config inside the new repository
